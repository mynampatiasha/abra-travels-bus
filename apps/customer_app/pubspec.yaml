name: customer_app
description: Abra Travels customer app (Android and iOS).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  meta: ^1.16.0
  shared_authentication:
  shared_core:
  shared_localization:
  shared_models:
  shared_network:
  shared_notifications:
  shared_storage:
  shared_theme:
  shared_ui:
  shared_validation:
  intl: any
  pdf: ^3.11.0
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  dio: ^5.7.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - l10n/
    - assets/images/
