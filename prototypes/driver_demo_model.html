<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abra Driver Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
.trip-hero{background:var(--gr);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.trip-hero .m{color:#DDF3FC}.trip-hero .st{background:#ffffff26;color:#fff}
.big-act{min-height:56px;font-size:16px}
.sosb{position:absolute;right:14px;bottom:76px;width:64px;height:64px;border-radius:50%;background:var(--r);color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(239,68,68,.45);z-index:30;display:grid;place-items:center}
.phone.land .sosb{bottom:14px}
.pax{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.pax:last-child{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--lb2);color:var(--db);display:grid;place-items:center;font-weight:800;flex:none}
.stopdot{display:flex;gap:10px;align-items:flex-start}
.drvpick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--ln);border-radius:14px;padding:12px;background:var(--card)}
.login{min-height:100%;background:var(--gr);display:flex;flex-direction:column;justify-content:center;padding:20px;gap:14px;color:#fff}
.login .c{color:var(--tx)}
</style>
</head>
<body>
<script src="shared/abra_langs.js"></script>
<script src="shared/abra_store.js"></script>
<script src="shared/abra_mobile.js"></script>
<script src="shared/abra_ai_mobile.js"></script>
<script>
/* =====================================================================
   ABRA TRAVELS - DRIVER APP DEMO (phone)
   Connected to the admin, client and customer prototypes through shared/abra_store.js:
   trips assigned in the client portal appear here; boarding, check-ins, live location,
   delays, trip end and SOS sent from here appear in the other apps at once.
   ===================================================================== */
const {$,$$,esc,money,fd,ft,fdt,rel,ic,chip,hb,kv,empty,fld,gv,toast,sheet,closeSheet,lab}=M;
AbraStore.init();
const DB=()=>AbraStore.get();
const S={who:localStorage.getItem('abra_driver_who')||'',tab:'home',trip:null};
const me=()=>DB().opStaff.find(s=>s.name===S.who&&s.role==='DRIVER');
const op=()=>{const m=me();return m?DB().operators.find(o=>o.id===m.operatorId):null};
const myTrips=()=>DB().trips.filter(t=>t.driver===S.who&&t.status!=='CANCELLED').sort((a,b)=>new Date(a.depart)-new Date(b.depart));
const RUN=['BOARDING','IN_TRANSIT','DEPARTED','DELAYED'];
const current=()=>{const L=myTrips();return L.find(t=>RUN.includes(t.status))||L.find(t=>t.status==='SCHEDULED'&&new Date(t.depart)>Date.now()-3*36e5)};
const paxOf=t=>DB().bookings.filter(b=>b.tripId===t.id&&b.status!=='CANCELLED');
const route=t=>DB().routes.find(r=>r.id===t.routeId)||{stops:[]};
const inbox=()=>AbraStore.inbox('driver:'+S.who).sort((a,b)=>new Date(b.at)-new Date(a.at));
const live=t=>DB().live.find(l=>l.tripId===t.id);
const save=s=>AbraStore.save(s||'driver');
M.addDict(`Choose your account|మీ ఖాతాను ఎంచుకోండి|अपना खाता चुनें
Sign in with your phone number. Demo: tap your name.|మీ ఫోన్ నంబర్‌తో సైన్ ఇన్ చేయండి. డెమో: మీ పేరు నొక్కండి.|अपने फ़ोन नंबर से साइन इन करें। डेमो: अपना नाम दबाएँ।
Your trip|మీ ట్రిప్|आपकी ट्रिप
Open trip|ట్రిప్ తెరవండి|ट्रिप खोलें
Checked in passengers|చెక్ ఇన్ అయిన ప్రయాణికులు|चेक इन हुए यात्री
Enter the PNR on the ticket|టికెట్‌లోని PNR నమోదు చేయండి|टिकट पर लिखा PNR डालें
Why are you late?|ఎందుకు ఆలస్యం?|देरी क्यों है?
How late?|ఎంత ఆలస్యం?|कितनी देरी?
Traffic|ట్రాఫిక్|ट्रैफ़िक
Breakdown|బ్రేక్‌డౌన్|खराबी
Weather|వాతావరణం|मौसम
Police check|పోలీసు తనిఖీ|पुलिस जाँच
Accident|ప్రమాదం|दुर्घटना
Medical emergency|వైద్య అత్యవసరం|चिकित्सा आपातकाल
Threat or fight|బెదిరింపు లేదా గొడవ|धमकी या झगड़ा
Send SOS|SOS పంపండి|SOS भेजें
What happened?|ఏమి జరిగింది?|क्या हुआ?
Location sharing|లొకేషన్ షేరింగ్|लोकेशन शेयरिंग
Licence|లైసెన్స్|लाइसेंस
Valid till|వరకు చెల్లుతుంది|तक मान्य
Company|కంపెనీ|कंपनी
Phone|ఫోన్|फ़ोन`);

/* ---------- screens ---------- */
function login(){const all=DB().opStaff.filter(s=>s.role==='DRIVER'&&s.status==='ACTIVE');const ops=[...new Set(all.map(s=>s.operatorId))];
return`<div class="scr"><div class="login"><div class="row">${ic('bus',30)}<h1 style="font-size:22px">Abra Driver</h1></div><p>Sign in with your phone number. Demo: tap your name.</p>
<div class="c col"><b>Choose your account</b>${ops.slice(0,6).map(o=>{const on=DB().operators.find(x=>x.id===o);return`<div class="sm m">${esc(on.name)}</div>`+all.filter(s=>s.operatorId===o).map(s=>{const n=DB().trips.filter(t=>t.driver===s.name&&t.status!=='CANCELLED'&&new Date(t.depart)>Date.now()-12*36e5).length;return`<button class="drvpick" data-a="in" data-v="${esc(s.name)}"><span class="av">${esc(s.name[0])}</span><span class="grow"><b>${esc(s.name)}</b><div class="sm m">${esc(s.phone)}</div></span>${n?`<span class="st b">${n} trip${n>1?'s':''}</span>`:''}</button>`}).join('')}).join('')}</div></div></div>`}
function shell(title,body,back){const un=inbox().filter(n=>!n.read).length;
return`<div class="hd">${back?`<button class="ib" data-a="tab" data-v="home" aria-label="Back">${ic('back')}</button>`:`<span class="ib">${ic('bus')}</span>`}<h1>${esc(title)}</h1><button class="ib" data-a="tab" data-v="alerts" aria-label="Notifications">${ic('bell')}${un?`<span class="dot">${un}</span>`:''}</button></div>
<div class="lay"><div class="main"><div class="scr"><div class="pad">${body}</div></div></div><nav class="tabs">${[['home','home','Home'],['trip','bus','Your trip'],['reports','cal','Reports'],['alerts','bell','Alerts'],['me','user','Profile']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${ic(i)}${l}${k==='alerts'&&un?`<span class="dot" style="top:4px;right:calc(50% - 22px)">${un}</span>`:''}</button>`).join('')}</nav></div>
${current()&&RUN.includes(current().status)?`<button class="sosb" data-a="sos" aria-label="Emergency SOS">SOS</button>`:''}`}
function actions(t){const pax=paxOf(t),ci=(t.checkedIn||[]).length;
if(t.status==='SCHEDULED')return`<button class="cta full big-act" data-a="board" data-v="${t.id}">${ic('users')} Start boarding</button>`;
if(t.status==='BOARDING')return`<button class="cta ok full big-act" data-a="start" data-v="${t.id}">${ic('play')} Start trip</button><div class="sm m tc">${ci} of ${pax.length} bookings checked in</div>`;
if(t.status==='DELAYED')return`<div class="row"><button class="cta full" data-a="resume" data-v="${t.id}">${ic('play')} Resume trip</button><button class="cta gh full" data-a="end" data-v="${t.id}">${ic('flag')} End trip</button></div>`;
if(['IN_TRANSIT','DEPARTED'].includes(t.status))return`<div class="row"><button class="cta gh full" data-a="delay" data-v="${t.id}">${ic('clock')} Report delay</button><button class="cta full" data-a="end" data-v="${t.id}">${ic('flag')} End trip</button></div>`;return''}
function tripCard(t){const pax=paxOf(t),l=live(t),seats=pax.reduce((a,b)=>a+b.seatsN,0);
return`<div class="trip-hero"><div class="row bt"><span class="sm m">${esc(t.id)}</span>${chip(t.status)}</div><h2 style="font-size:20px">${esc(t.route)}</h2>
<div class="row rw sm m">${ic('clock',14)} ${fdt(t.depart)} · ${ic('bus',14)} ${esc(t.bus)}</div>
<div class="row rw sm">${ic('users',14)} ${seats} passengers in ${pax.length} bookings · ${(t.checkedIn||[]).length} checked in</div>
${t.status==='DELAYED'?`<div class="sm">${ic('alert',14)} Delayed ${t.delay||''} min${t.delayReason?': '+esc(t.delayReason):''}</div>`:''}
${l?`<div class="bar" style="background:#ffffff33"><i style="width:${l.progress}%;background:#fff"></i></div><div class="sm m">${l.progress}% of the route · ${l.speed} km/h · location shared ${rel(l.ping)}</div>`:''}</div>${actions(t)}`}
function home(){const t=current(),next=myTrips().filter(x=>x!==t&&new Date(x.depart)>Date.now()&&x.status==='SCHEDULED').slice(0,4);
return shell('Hello, '+S.who.split(' ')[0],`${op()&&op().status==='SUSPENDED'?hb('Your company is suspended by Abra. Trips are on hold.','r','alert'):''}${dueBanner()}
${t?tripCard(t)+`<button class="cta gh full" data-a="tab" data-v="trip">Open trip ${ic('chevR',16)}</button>`:`<div class="c">${empty('No trips today','New trips from your company appear here at once.')}</div>`}
<h3>Next trips</h3>${next.length?next.map(x=>`<div class="c row"><div class="grow"><b>${esc(x.route)}</b><div class="sm m">${fdt(x.depart)} · ${esc(x.bus)}</div></div>${chip(x.status)}</div>`).join(''):'<p class="sm m">Nothing else planned.</p>'}`)}
function tripScreen(){const t=current();if(!t)return shell('Your trip',`<div class="c">${empty('No trips today','New trips from your company appear here at once.')}</div>`,1);
const r=route(t),l=live(t),pax=paxOf(t),ci=t.checkedIn||[],pr=l?l.progress:t.status==='ARRIVED'?100:0,n=r.stops.length,cur=Math.min(n-1,Math.floor(pr/100*(n-1)+.0001));
return shell(t.id,`${tripCard(t)}
${l?`<div class="c">${M.mapBox([{x:15+70*pr/100,y:70-40*pr/100,l:t.bus,c:l.state==='LIVE'?'grn':'red'}],170,[[15,70],[85,30]])}<div class="row bt sm mt2"><span>${ic('nav',14)} Location sharing on</span><span class="m">${rel(l.ping)}</span></div></div>`:''}
<div class="c"><h3>Stops</h3><div class="tl mt2">${r.stops.map((s,i)=>`<div class="ev ${l&&i<cur?'d':l&&i===cur?'c':''}"><b>${esc(s.name)}</b><div class="sm m">${esc(s.city)} · ${ft(new Date(new Date(t.depart).getTime()+s.offset*6e4))} · ${s.type==='DROPPING'?'Drop':'Pick up'}</div></div>`).join('')}</div></div>
<div class="c"><div class="row bt"><h3>Passengers (${pax.length})</h3><button class="cta sm" data-a="scan" data-v="${t.id}">${ic('qr',14)} Scan ticket</button></div>
${pax.length?pax.map(b=>`<div class="pax"><span class="av">${esc(b.customer[0])}</span><div class="grow"><b>${esc(b.customer)}</b><div class="sm m">${esc(b.pnr)} · seats ${esc(b.seatList)}${b.board?' · '+esc(b.board):''}</div></div>${ci.includes(b.id)?chip('Checked in','g'):`<button class="cta sm gh" data-a="ci" data-v="${b.id}" ${['SCHEDULED','ARRIVED'].includes(t.status)?'disabled':''}>Check in</button>`}</div>`).join(''):'<p class="sm m">No bookings on this trip yet.</p>'}
${t.status==='SCHEDULED'?'<p class="sm m">Check-in opens when you start boarding.</p>':''}</div>`,1)}
function alerts(){const L=inbox();return shell('Notifications',`<div class="row bt"><span class="sm m">${L.filter(n=>!n.read).length} unread</span><button class="cta sm gh" data-a="readall">Mark all read</button></div>
${L.length?L.map(n=>`<div class="c" style="${n.read?'':'border-color:var(--s)'}"><b>${esc(n.t)}</b><div class="sm m">${esc(n.b)}</div><div class="sm m">${rel(n.at)}</div></div>`).join(''):`<div class="c">${empty('No notifications','Trip changes from your company and Abra appear here.')}</div>`}`,1)}
function profile(){const m=me(),o=op();return shell('Profile',`<div class="c row"><span class="av" style="width:56px;height:56px;font-size:22px">${esc(S.who[0])}</span><div><h3>${esc(S.who)}</h3><div class="sm m">${esc(o?o.name:'')}</div></div></div>
<div class="c">${kv({Phone:esc(m.phone),Licence:esc(m.licence||'-'),'Valid till':m.licExp?fd(m.licExp):'-',Company:esc(o?o.name:'')})}${m.licExp&&new Date(m.licExp)-Date.now()<30*864e5?hb('Your licence expires soon. Give the new copy to your company.','a','alert'):''}</div>
<div class="c">${kv({'Trips done':myTrips().filter(t=>t.status==='ARRIVED').length,'Upcoming':myTrips().filter(t=>t.status==='SCHEDULED').length})}</div>
<button class="cta gh full" data-a="out">${ic('logout')} Sign out</button>`,1)}
function view(){if(!S.who||!me())return login();return view2()||(S.tab==='trip'?tripScreen():S.tab==='alerts'?alerts():S.tab==='me'?profile():home())}

/* ---------- actions ---------- */
const T=id=>DB().trips.find(t=>t.id===id);
Object.assign(M.A,{
in:v=>{S.who=v;localStorage.setItem('abra_driver_who',v);S.tab='home';M.render();toast('Signed in')},
out:()=>{S.who='';localStorage.removeItem('abra_driver_who');M.render()},
tab:v=>{S.tab=v;if(v==='alerts'){}M.render()},
readall:()=>{inbox().forEach(n=>n.read=true);save();M.render()},
board:v=>{const t=T(v);t.status='BOARDING';save();M.render();toast('Boarding started. Passengers were told.')},
start_run:v=>{const t=T(v),pax=paxOf(t),miss=pax.filter(b=>!(t.checkedIn||[]).includes(b.id)).length;
const go=()=>{t.status='IN_TRANSIT';const r=route(t);DB().live=DB().live.filter(l=>l.tripId!==t.id);DB().live.push({tripId:t.id,route:t.route,bus:t.bus,operator:t.operator,driver:t.driver,state:'LIVE',ping:new Date().toISOString(),speed:42,progress:0,eta:new Date(Date.now()+(r.hours||8)*36e5).toISOString(),x:15,y:70,pax:t.booked,checkedIn:(t.checkedIn||[]).length,stops:r.stops.map(s=>s.name),src:'driver'});closeSheet();save();M.render();toast('Trip started. Your location is shared.')};
if(miss){sheet('Start trip?',`${hb(miss+' booking(s) are not checked in. Start anyway? They are marked as no-show for the operator.','a','alert')}`,`<button class="cta gh" data-a="sheet_x">Cancel</button><button class="cta ok" data-a="start_ok" data-v="${v}">Start trip</button>`);M.A.start_ok=()=>go()}else go()},
delay:v=>{S.dm=30;S.dr='Traffic';sheet('Report delay',`<b>How late?</b><div class="row rw">${[15,30,45,60,90].map(m=>`<button class="ch ${m===30?'on':''}" data-a="dm" data-v="${m}">${m} min</button>`).join('')}</div><b>Why are you late?</b><div class="row rw">${['Traffic','Breakdown','Weather','Police check'].map(r=>`<button class="ch ${r==='Traffic'?'on':''}" data-a="dr" data-v="${r}">${r}</button>`).join('')}</div>${hb('Passengers, your company and Abra are told at once.','b','info')}${M.proofField('dp',false,'Photo or screenshot (optional)')}`,`<button class="cta gh" data-a="sheet_x">Cancel</button><button class="cta" data-a="delay_ok" data-v="${v}">Report delay</button>`)},
dm:(v,el)=>{S.dm=Number(v);$$('[data-a=dm]').forEach(b=>b.classList.toggle('on',b===el))},
dr:(v,el)=>{S.dr=v;$$('[data-a=dr]').forEach(b=>b.classList.toggle('on',b===el))},
delay_ok:async v=>{const ids=await M.readProofs('dp',false,'Driver '+S.who);if(ids===null)return;const t=T(v);t.status='DELAYED';t.delay=S.dm;t.delayReason=S.dr;t.delayFiles=ids;const l=live(t);if(l)l.state='DELAYED';closeSheet();save();M.render();toast('Delay reported')},
resume:v=>{const t=T(v);t.status='IN_TRANSIT';const l=live(t);if(l)l.state='LIVE';save();M.render();toast('Trip resumed')},
end:v=>sheet('End trip?',hb('Passengers are marked as arrived and location sharing stops.','b','flag'),`<button class="cta gh" data-a="sheet_x">Cancel</button><button class="cta" data-a="end_ok" data-v="${v}">End trip</button>`),
end_ok:v=>{const t=T(v);t.status='ARRIVED';DB().bookings.filter(b=>b.tripId===v&&b.status==='CONFIRMED').forEach(b=>b.status='COMPLETED');DB().live=DB().live.filter(l=>l.tripId!==v);closeSheet();save();M.render();toast('Trip ended. Well done!')},
ci:v=>{const b=DB().bookings.find(x=>x.id===v),t=T(b.tripId);t.checkedIn=(t.checkedIn||[]).concat(v);const l=live(t);if(l)l.checkedIn=t.checkedIn.length;save();M.keepScroll=true;M.render();toast(b.customer+' checked in')},
scan:v=>{const t=T(v);sheet('Scan ticket',`<div class="tc">${ic('qr',64)}<p class="sm m">Point the camera at the QR code on the ticket. Demo: type the PNR or pick one.</p></div>${fld('pnr','Enter the PNR on the ticket','',{ph:'ABRK5001A'})}<div class="row rw">${paxOf(t).slice(0,3).map(b=>`<button class="ch" data-a="pick" data-v="${esc(b.pnr)}">${esc(b.pnr)}</button>`).join('')}<button class="ch" data-a="pick" data-v="ABRX0000Z">Wrong ticket</button></div>`,`<button class="cta gh" data-a="sheet_x">Close</button><button class="cta" data-a="scan_ok" data-v="${v}">Check in</button>`)},
pick:v=>{const e=$('#f_pnr');if(e)e.value=v},
scan_ok:v=>{const t=T(v),p=gv('pnr').trim().toUpperCase(),b=DB().bookings.find(x=>x.pnr===p);
if(t.status==='SCHEDULED'){closeSheet();return toast('Start boarding first')}
if(!b)return toast('No ticket with PNR '+p);if(b.tripId!==v)return toast('This ticket is for another trip ('+b.route+')');if(b.status==='CANCELLED')return toast('This booking was cancelled');
if((t.checkedIn||[]).includes(b.id))return toast(b.customer+' is already checked in');closeSheet();M.A.ci(b.id)},
sos:()=>sheet('Emergency SOS',`<b>What happened?</b><div class="col">${['Accident','Breakdown','Medical emergency','Threat or fight'].map((x,i)=>`<button class="ch ${i===0?'on':''}" style="justify-content:flex-start" data-a="sosk" data-v="${x}">${x}</button>`).join('')}</div>${hb('Abra\'s safety team and your company get your location at once. Call 112 if anyone is hurt.','r','alert')}${M.proofField('sp',false,'Photo of the situation (optional)')}`,`<button class="cta gh" data-a="sheet_x">Cancel</button><button class="cta dg" data-a="sos_ok">Send SOS</button>`),
sosk:(v,el)=>{S.sosk=v;$$('[data-a=sosk]').forEach(b=>b.classList.toggle('on',b===el))},
sos_ok:async()=>{const ids=await M.readProofs('sp',false,'Driver '+S.who);if(ids===null)return;const t=current(),l=t&&live(t),m=me(),k=S.sosk||'Accident';DB().sos.unshift({id:AbraStore.uid('SOS'),customer:'Driver '+S.who,phone:m.phone,trip:t.id,route:t.route,bus:t.bus,driver:S.who,operator:t.operator,status:'NEW',at:new Date().toISOString(),note:'Driver SOS: '+k,x:l?l.x:50,y:l?l.y:50,contacts:['Operator control room'],log:[['SOS received from the driver',new Date().toISOString(),ids]],assignee:'',fromDriver:true});closeSheet();save();M.render();toast('SOS sent. Abra safety team is calling you.')}
});
/* ---------- reports and trip checklists (the rules come from the driver's company) ---------- */
const DR=AbraStore.DR,opId=()=>(me()||{}).operatorId,rules=()=>DR.rulesFor(DB(),opId());
S.pfiles={};
const _pk=M.A.pf_pick;M.A.pf_pick=(v,el)=>{S.pfiles[el.id]=[...el.files];_pk(v,el);if(/^f_pc_/.test(el.id)&&(S.tab==='pre'||S.tab==='endchk'))setTimeout(()=>{M.keepScroll=true;M.render()},0)};
M.afterRender=()=>{Object.entries(S.pfiles).forEach(([id,fs])=>{const el=document.getElementById(id);if(el&&fs.length&&!(el.files&&el.files.length)){try{const dt=new DataTransfer();fs.forEach(f=>dt.items.add(f));el.files=dt.files}catch(e){}const l=document.getElementById('pfl_'+id.slice(2));if(l)l.innerHTML=fs.map(f=>`<div>${esc(f.name)}</div>`).join('')}})};
const hasFile=id=>!!(S.pfiles['f_'+id]&&S.pfiles['f_'+id].length);
const stChip=s=>({DUE:chip('Due','a'),OVERDUE:chip('Overdue','r'),SUBMITTED:chip('Sent','b'),APPROVED:chip('Approved','g'),RETURNED:chip('Sent back','r'),DRAFT:chip('Draft','n')}[s]||chip(s));
const dueText=x=>{const m=Math.round((x.due-Date.now())/6e4);return x.state==='OVERDUE'?'Was due '+fdt(x.due):m>0?'Due '+(m<60?'in '+m+' min':m<1440?'in '+Math.round(m/60)+' h':fdt(x.due)):'Due '+fdt(x.due)};
const toSend=()=>DR.statusList(opId(),S.who,DB()).filter(x=>['DUE','OVERDUE','RETURNED','DRAFT'].includes(x.state));

if(!t)return needTrip(lg);
const pax=paxOf(t),ci=t.checkedIn||[],ns=nextStop(t);
if(H(/not checked|missing|who.*(left|remaining)|చెక్ ఇన్ కాలేదు|రాలేదు|चेक इन नहीं|नहीं आए/i)){const L=pax.filter(b=>!ci.includes(b.id));return{html:L.length?AL(lg,`<b>${L.length}</b> booking(s) not checked in:`,`<b>${L.length}</b> బుకింగ్‌లు చెక్ ఇన్ కాలేదు:`,`<b>${L.length}</b> बुकिंग चेक इन नहीं हुईं:`)+`<div class="aicard">${L.map(b=>`<div class="row bt sm"><span>${esc(b.customer)} · ${esc(b.seatList)}</span><span class="m">${esc(b.board||'')}</span></div>`).join('')}</div>`:AL(lg,'Everyone is checked in.','అందరూ చెక్ ఇన్ అయ్యారు.','सभी चेक इन हो गए।'),steps:['get_passengers('+t.id+') → '+pax.length,'filter(not checked in) → '+L.length]}}
if(H(/how many|board.*next|next.*board|ఎంత మంది|कितने/i)){const L=ns?pax.filter(b=>(b.board||route(t).stops[0].name)===ns.s.name):[];const seats=L.reduce((a,b)=>a+b.seatsN,0);return{html:AL(lg,`At <b>${esc(ns.s.name)}</b>, <b>${seats}</b> passenger(s) in ${L.length} booking(s) get on.`,`<b>${esc(ns.s.name)}</b> వద్ద ${L.length} బుకింగ్‌లలో <b>${seats}</b> మంది ఎక్కుతారు.`,`<b>${esc(ns.s.name)}</b> पर ${L.length} बुकिंग में <b>${seats}</b> यात्री चढ़ेंगे।`)+(L.length?`<div class="aicard">${L.map(b=>`<div class="sm">${esc(b.customer)} · ${esc(b.seatList)}</div>`).join('')}</div>`:''),steps:['get_next_stop('+t.id+') → '+ns.s.name,'count_boarding('+ns.s.name+') → '+seats]}}
if(H(/next stop|where.*next|తదుపరి స్టాప్|తర్వాత స్టాప్|अगला स्टॉप|अगला पड़ाव/i)){const min=Math.max(0,Math.round((ns.at-Date.now())/6e4));return{html:AL(lg,`Next stop: <b>${esc(ns.s.name)}</b>, ${esc(ns.s.city)}, at about <b>${ft(ns.at)}</b> (${min} minutes). It is a ${ns.s.type==='DROPPING'?'drop':'pick-up'} point.`,`తదుపరి స్టాప్: <b>${esc(ns.s.name)}</b>, ${esc(ns.s.city)}, సుమారు <b>${ft(ns.at)}</b> (${min} నిమిషాలు).`,`अगला स्टॉप: <b>${esc(ns.s.name)}</b>, ${esc(ns.s.city)}, लगभग <b>${ft(ns.at)}</b> (${min} मिनट)।`)+`<div>${`<button class="cta sm gh" data-a="dai_map" data-v="${esc(ns.s.name)}">Directions</button>`}</div>`,steps:['get_route('+t.routeId+')','get_live_progress('+t.id+')']}}
if(H(/direction|navigate|map|route to|దారి|రాస్తా|रास्ता|नक्शा/i))return{html:AL(lg,`Opening directions to ${esc(ns.s.name)}.`,`${esc(ns.s.name)} కి దారి తెరుస్తున్నాను.`,`${esc(ns.s.name)} का रास्ता खोल रहा हूँ।`)+`<div><button class="cta sm" data-a="dai_map" data-v="${esc(ns.s.name)}">Open maps</button></div>`};
const mins=(q.match(/(\d{1,3})\s*(min|minutes|నిమి|मिनट)/i)||[])[1];
if(H(/delay|late|ఆలస్య|లేట్|देरी|लेट/i)){const m=Number(mins||30),reason=H(/break ?down|బ్రేక్|खराब/i)?'Breakdown':H(/rain|weather|వర్షం|बारिश/i)?'Weather':H(/police|పోలీస|पुलिस/i)?'Police check':'Traffic';
return{html:AL(lg,'This tells your passengers, your company and Abra.','ఇది మీ ప్రయాణికులు, కంపెనీ, అబ్రాకు తెలియజేస్తుంది.','इससे यात्रियों, कंपनी और अब्रा को सूचना जाएगी।'),pend:M.ai.mkPend({lg,desc:AL(lg,`Report <b>${m} minutes</b> delay on ${t.id} because of <b>${reason}</b>.`,`${t.id} లో <b>${reason}</b> వల్ల <b>${m} నిమిషాల</b> ఆలస్యం నివేదించాలి.`,`${t.id} पर <b>${reason}</b> के कारण <b>${m} मिनट</b> की देरी बताएँ।`),check:()=>['IN_TRANSIT','DELAYED','BOARDING'].includes(t.status)?'':'Start the trip first.',run:()=>{t.status='DELAYED';t.delay=m;t.delayReason=reason;const l=live(t);if(l)l.state='DELAYED';save();return AL(lg,'Delay reported. Passengers were told.','ఆలస్యం నివేదించాను. ప్రయాణికులకు తెలియజేశాం.','देरी बता दी। यात्रियों को सूचित किया।')}})}}
if(H(/start boarding|boarding start|బోర్డింగ్ ప్రారంభ|बोर्डिंग शुरू/i))return{html:'',pend:M.ai.mkPend({lg,desc:AL(lg,`Start boarding for ${t.id} (${esc(t.route)}).`,`${t.id} కి బోర్డింగ్ ప్రారంభించాలి.`,`${t.id} की बोर्डिंग शुरू करें।`),check:()=>t.status==='SCHEDULED'?'':'Boarding has already started.',run:()=>{t.status='BOARDING';save();return AL(lg,'Boarding started. Passengers were told.','బోర్డింగ్ ప్రారంభమైంది.','बोर्डिंग शुरू हो गई।')}})};
if(H(/start (the )?trip|start driving|ట్రిప్ ప్రారంభ|ट्रिप शुरू/i)){if(t.status!=='BOARDING')return{html:AL(lg,'Start boarding first. Then I can open the checklist for you.','మొదట బోర్డింగ్ ప్రారంభించండి.','पहले बोर्डिंग शुरू करें।')};setTimeout(()=>{M.ai.open=false;M.A.start(t.id)},500);return{html:AL(lg,'Before a trip starts you must finish the checklist. I opened it for you.','ట్రిప్ ప్రారంభించే ముందు చెక్‌లిస్ట్ పూర్తి చేయాలి. నేను తెరిచాను.','ट्रिप शुरू करने से पहले चेकलिस्ट पूरी करनी होती है। मैंने खोल दी है।')}}
if(H(/end (the )?trip|finish|reached|arrived|ట్రిప్ ముగించ|ट्रिप खत्म|पहुँच गए/i)){if(!['IN_TRANSIT','DELAYED','DEPARTED'].includes(t.status))return{html:AL(lg,'The trip is not running.','ట్రిప్ నడవడం లేదు.','ट्रिप चल नहीं रही।')};setTimeout(()=>{M.ai.open=false;M.A.end(t.id)},500);return{html:AL(lg,'Before you end the trip, please answer the end-of-trip checks. I opened them for you.','ట్రిప్ ముగించే ముందు చెక్స్ పూర్తి చేయండి.','ट्रिप खत्म करने से पहले जाँच पूरी करें।')}}
if(H(/call|phone|కాల్|कॉल/i))return{html:AL(lg,'Calling your company control room... (demo)','మీ కంపెనీ కంట్రోల్ రూమ్‌కు కాల్ చేస్తున్నాను... (డెమో)','आपकी कंपनी के कंट्रोल रूम को कॉल कर रहा हूँ... (डेमो)')};
const l=live(t),seats=pax.reduce((a,b)=>a+b.seatsN,0);
return{html:AL(lg,`<b>${t.id}</b> · ${esc(t.route)} · ${lab(t.status)}. ${seats} passengers in ${pax.length} bookings, ${ci.length} checked in.${l?' '+l.progress+'% of the route done.':''}${ns?' Next stop '+esc(ns.s.name)+' at '+ft(ns.at)+'.':''}`,`<b>${t.id}</b> · ${esc(t.route)} · ${lab(t.status)}. ${pax.length} బుకింగ్‌లలో ${seats} మంది, ${ci.length} చెక్ ఇన్.${l?' '+l.progress+'% మార్గం పూర్తి.':''}${ns?' తదుపరి స్టాప్ '+esc(ns.s.name)+' '+ft(ns.at)+'.':''}`,`<b>${t.id}</b> · ${esc(t.route)} · ${lab(t.status)}। ${pax.length} बुकिंग में ${seats} यात्री, ${ci.length} चेक इन।${l?' '+l.progress+'% रास्ता पूरा।':''}${ns?' अगला स्टॉप '+esc(ns.s.name)+' '+ft(ns.at)+'।':''}`),chips:['Next stop','Who has not checked in?','Report 30 minutes delay, traffic']}}
Object.assign(M.ai,{enabled:()=>!!S.who&&!!me(),title:'Driver assistant',voiceFirst:true,speak:true,fabLeft:true,answer:drvAnswer,
welcome:'Tap the microphone and speak. Ask for the next stop, who has not checked in, or say "report 30 minutes delay". I confirm before changing anything.',
sugg:()=>['Trip summary','Next stop','How many board at the next stop?','Who has not checked in?','Start boarding','Start trip','Report 30 minutes delay, traffic','End trip']});
M.addDict(`Tap the microphone and speak. Ask for the next stop, who has not checked in, or say "report 30 minutes delay". I confirm before changing anything.|మైక్ నొక్కి మాట్లాడండి. తదుపరి స్టాప్, ఎవరు చెక్ ఇన్ కాలేదు అడగండి, లేదా "30 నిమిషాల ఆలస్యం నివేదించు" అనండి. ఏదైనా మార్చే ముందు నిర్ధారిస్తాను.|माइक दबाएँ और बोलें। अगला स्टॉप, किसने चेक इन नहीं किया पूछें, या कहें "30 मिनट देरी बताओ"। कुछ भी बदलने से पहले पुष्टि करूँगा।
Driver assistant|డ్రైవర్ అసిస్టెంట్|ड्राइवर असिस्टेंट
Trip summary|ట్రిప్ సారాంశం|ट्रिप सारांश
Next stop|తదుపరి స్టాప్|अगला स्टॉप
How many board at the next stop?|తదుపరి స్టాప్‌లో ఎంత మంది ఎక్కుతారు?|अगले स्टॉप पर कितने चढ़ेंगे?
Who has not checked in?|ఎవరు చెక్ ఇన్ కాలేదు?|किसने चेक इन नहीं किया?
Report 30 minutes delay, traffic|ట్రాఫిక్ వల్ల 30 నిమిషాల ఆలస్యం నివేదించు|ट्रैफ़िक के कारण 30 मिनट देरी बताओ
Directions|దారి|रास्ता
Open maps|మ్యాప్ తెరవండి|मैप खोलें`);
M.A.dai_map=v=>{const p=DB().places.find(x=>x.name===v)||{};window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.lat&&p.lng?p.lat+','+p.lng:v),'_blank','noopener')};

M.boot('driver',view);
</script>
