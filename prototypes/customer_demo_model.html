/* ---------- common frame ---------- */
function bell(){const un=inbox().filter(n=>!n.read).length;return`<button class="ib" data-a="go" data-v="notifs" aria-label="Notifications">${ic('bell')}${un?`<span class="dot">${un}</span>`:''}</button>`}
function hdr(title,back,extra){return`<div class="hd">${back?`<button class="ib" data-a="back" aria-label="Back">${ic('back')}</button>`:`<span class="ib">${ic('bus')}</span>`}<h1>${esc(title)}</h1>${extra||''}${bell()}</div>`}
function tabs(){return`<nav class="tabs" aria-label="Main sections">${[['home','home','Home'],['trips','ticket','My trips'],['support','help','Support'],['me','user','Profile']].map(([k,i,l])=>`<button class="${S.tab===k&&!S.stack.length?'on':''}" data-a="tab" data-v="${k}">${ic(i)}${l}</button>`).join('')}</nav>`}
const shell=inner=>`<div class="lay"><div class="main">${inner}</div>${tabs()}</div>`;
const page=(title,body,o={})=>{const inner=`${hdr(title,o.back!==false&&(o.back||S.stack.length),o.extra)}<div class="scr"><div class="pad">${body}</div></div>${o.foot||''}`;return o.foot||o.noTabs?`<div class="lay"><div class="main">${inner}</div></div>`:shell(inner)};
const guest=(t,s)=>`<div class="c tc">${M.empty(t,s)}<button class="cta full" data-a="login">${ic('user')} Log in / Sign up</button></div>`;
const fmtLeft=()=>{const s=Math.max(0,Math.round((S.holdUntil-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const timer=()=>S.holdUntil?`<span class="timer" id="tmr">${ic('clock',12)} ${fmtLeft()}</span>`:'';
const holdBar=()=>S.holdUntil?hb('Seats held for '+timer()+'. Pay before the timer ends.','a','clock'):'';

<div class="c"><h3>Good to know</h3>${['Every operator is approved by Abra Travels','Fares are shown before you choose','Boarding and dropping points come with timings'].map(x=>`<div class="row sm">${ic('check',16)} ${x}</div>`).join('')}</div></div></div>`)}
function cityPicker(which){const C=DB().cities.filter(c=>c.active),q=(S.cq||'').toLowerCase(),L=q?C.filter(c=>c.name.toLowerCase().includes(q)||(c.te||'').includes(q)||(c.hi||'').includes(q)):[];

/* ---------- results, filters, sort ---------- */
const WIN=[['em','Before 6 AM',0,6],['mo','6 AM to 12 PM',6,12],['af','12 PM to 6 PM',12,18],['ni','After 6 PM',18,24]];
const btype=t=>/Semi/.test(t.type)?'Semi-sleeper':/Sleeper/.test(t.type)?'Sleeper':'Seater';
const isAc=t=>!/Non-AC/.test(t.type);
function baseResults(){const q=S.q;return DB().trips.filter(t=>{const r=route(t);return r.from===q.from&&r.to===q.to&&sameDay(t.depart,q.date+'T12:00')&&AbraStore.bookable(t)})}
function applyF(L){const f=S.f;return L.filter(t=>{const h=new Date(t.depart).getHours();if(f.win.length&&!f.win.some(w=>{const x=WIN.find(y=>y[0]===w);return h>=x[2]&&h<x[3]}))return false;if(f.type.length&&!f.type.includes(btype(t)))return false;if(f.ac&&(f.ac==='ac')!==isAc(t))return false;if(f.ops.length&&!f.ops.includes(t.operatorId))return false;if(f.am.length&&!f.am.every(a=>amenOf(t).includes(a)))return false;if(f.max&&price(t).seat>f.max)return false;return true})}
const nF=()=>{const f=S.f;return f.win.length+f.type.length+(f.ac?1:0)+f.ops.length+f.am.length+(f.max?1:0)};
const SORTS=[['early','Departure: earliest first'],['late','Departure: latest first'],['low','Price: lowest first'],['high','Price: highest first'],['short','Duration: shortest first']];
function results(){if(S.loadingR){setTimeout(()=>{S.loadingR=false;M.render()},450);return page(S.q.from+' → '+S.q.to,'<div class="sk"></div><div class="sk"></div><div class="sk"></div>',{back:1})}
const all=baseResults();let L=applyF(all);const srt={early:(a,b)=>new Date(a.depart)-new Date(b.depart),late:(a,b)=>new Date(b.depart)-new Date(a.depart),low:(a,b)=>price(a).seat-price(b).seat,high:(a,b)=>price(b).seat-price(a).seat,short:(a,b)=>hrs(a)-hrs(b)}[S.sort];L.sort(srt);
const shown=L.slice(0,S.page*5),today=new Date().toISOString().slice(0,10);
return page(S.q.from+' → '+S.q.to,`<div class="row bt"><button class="cta sm gh" data-a="day" data-v="-1" ${S.q.date<=today?'disabled':''}>${ic('back',14)} Previous day</button><b class="sm">${fd(S.q.date+'T12:00')}</b><button class="cta sm gh" data-a="day" data-v="1">Next day ${ic('chevR',14)}</button></div>
<div class="row bt"><span class="sm m">${L.length} ${L.length===1?'bus':'buses'}</span><div class="row"><button class="ch" data-a="sortsh">${ic('swap',14)} Sort</button><button class="ch ${nF()?'on':''}" data-a="filtsh">${ic('tag',14)} Filter${nF()?' · '+nF():''}</button></div></div>
${L.length?shown.map(t=>{const p=price(t),f=free(t),o=opOf(t),so=f===0,nd=!sameDay(arr(t),t.depart);return`<button class="c res ${so?'so':''}" data-a="trip" data-v="${t.id}" ${so?'disabled':''}><div class="row bt"><b>${esc(o.name)}</b><span class="pr">${so?'<span class="st n">Sold out</span>':'From '+money(p.seat)}</span></div><div class="sm m">${esc(t.type)} · ★ ${o.rating} ${t.status==='DELAYED'?chip('DELAYED'):''}</div>
<div class="row bt"><span><b>${ft(t.depart)}</b> → <b>${ft(arr(t))}</b> <span class="sm m">${hrs(t)}h 0m${nd?' · Arrives next day':''}</span></span><span class="sm" style="${f<6&&!so?'color:var(--rtx);font-weight:700':''}">${so?'':f+(f===1?' seat left':' seats left')}</span></div><div class="amen">${amenOf(t).slice(0,3).map(a=>`<span>${esc(a)}</span>`).join('')}</div></button>`}).join('')+(L.length>shown.length?`<button class="cta gh full" data-a="more">Show more buses</button>`:'')
:`<div class="c">${all.length?M.empty('No buses found','No buses match your filters.'):M.empty('No buses found','There are no buses on this route on this date. Try another date.')}<div class="row" style="justify-content:center">${all.length?'<button class="cta sm" data-a="fclear">Clear filters</button>':'<button class="cta sm" data-a="day" data-v="1">Next day</button>'}</div></div>`}`,{back:1})}
function filterSheet(){const all=baseResults(),f=S.f,cnt=fn=>all.filter(fn).length,ops=[...new Set(all.map(t=>t.operatorId))],maxP=Math.max(100000,...all.map(t=>price(t).seat)),ams=[...new Set(all.flatMap(amenOf))];
const chipT=(k,v,l,n)=>`<button class="ch ${(Array.isArray(f[k])?f[k].includes(v):f[k]===v)?'on':''}" data-a="fset" data-v="${k}|${v}">${esc(l)}${n!=null?` (${n})`:''}</button>`;
sheet('Filters',`<b>Departure time</b><div class="row rw">${WIN.map(w=>chipT('win',w[0],w[1],cnt(t=>{const h=new Date(t.depart).getHours();return h>=w[2]&&h<w[3]}))).join('')}</div>
<b>Bus type</b><div class="row rw">${['Seater','Sleeper','Semi-sleeper'].map(x=>chipT('type',x,x,cnt(t=>btype(t)===x))).join('')}</div>
<b>Air conditioning</b><div class="row rw">${chipT('ac','ac','AC',cnt(isAc))}${chipT('ac','non','Non-AC',cnt(t=>!isAc(t)))}</div>
<b>Operator</b><div class="row rw">${ops.map(o=>chipT('ops',o,(DB().operators.find(x=>x.id===o)||{}).name,cnt(t=>t.operatorId===o))).join('')||'<span class="sm m">-</span>'}</div>
<b>Amenities</b><div class="row rw">${ams.map(a=>chipT('am',a,a)).join('')||'<span class="sm m">-</span>'}</div>
<b>Maximum price</b><div class="row"><input type="range" id="f_max" min="0" max="${maxP}" step="5000" value="${f.max||maxP}" class="grow" aria-label="Maximum price" data-live="fmax"><b id="fmaxv" class="sm">${money(f.max||maxP)}</b></div>`,`<button class="cta gh" data-a="fclear">Reset</button><button class="cta" data-a="fapply">Show buses</button>`)}

/* ---------- trip details ---------- */
function policy(){const sl=[...DB().cancelSlabs].sort((a,b)=>b.hours-a.hours);return sl.map((s,i)=>`<div class="row bt sm"><span>${i===0?'More than '+s.hours+' hours before departure':s.hours===0?'Under '+sl[i-1].hours+' hours':s.hours+' to '+sl[i-1].hours+' hours before'}</span><b>${s.pct?s.pct+'% refund':'No refund'}</b></div>`).join('')}
function tripDetails(id){const t=T(id);if(!t||!AbraStore.bookable(t))return page('Trip details',M.empty('This bus is no longer available','It may have departed or been cancelled. Search again to see current buses.'),{back:1});
const o=opOf(t),r=route(t),p=price(t),bp=r.stops.filter(s=>s.type!=='DROPPING'),dp=r.stops.filter(s=>s.type!=='BOARDING'),via=[...new Set(r.stops.map(s=>s.city))].filter(c=>c!==r.from&&c!==r.to);

return page(o.name,`<div class="c"><div class="row bt"><b>${esc(t.type)}</b><span class="sm">★ ${o.rating}</span></div><div class="row bt"><span><b>${ft(t.depart)}</b> → <b>${ft(arr(t))}</b></span><span class="sm m">${hrs(t)}h</span></div><div class="sm m">${fd(t.depart)} · Bus number ${esc(t.bus)}${via.length?' · Via '+esc(via.join(', ')):''}</div></div>
<div class="c"><h3>Boarding points</h3>${pts(bp)}</div><div class="c"><h3>Dropping points</h3>${pts(dp)}</div>
<div class="c"><h3>Amenities</h3><div class="amen">${amenOf(t).map(a=>`<span>${esc(a)}</span>`).join('')}</div></div>
<div class="c"><h3>Cancellation policy</h3>${policy()}</div><p class="sm m">Lowest seat price. The amount to pay is shown before payment.</p>`,{back:1,foot:`<div class="botbar"><div class="grow"><b>From ${money(p.seat)}</b><div class="sm m">${free(t)} seats left</div></div><button class="cta" data-a="seats" data-v="${t.id}">Select seats</button></div>`})}

/* ---------- seats: drawn from the operator's seat layout (client portal) ---------- */
function layoutOf(t){const b=busOf(t),sl=btype(t)==='Sleeper',cell=(c,i,z)=>'SBL'.includes(c)&&i.v<z?{c,i:i.v++}:{c:c==='_'?'_':'.'};
if(b.seatMap&&b.seatMap.length){const i={v:0};return[b.seatMap.map(r=>[...r].map(c=>cell(c,i,t.seats)))]}
if(!sl){const i={v:0};return[Array.from({length:Math.ceil(t.seats/4)},()=>[...'SS_SS'].map(c=>cell(c,i,t.seats)))]}
const half=Math.ceil(t.seats/2),deck=(a,z)=>{const i={v:a};return Array.from({length:Math.ceil((z-a)/3)},()=>[...'BB_B'].map(c=>cell(c,i,z)))};return[deck(0,half),deck(half,t.seats)]}
function seatsScreen(){const t=T(S.trip);if(!t)return page('Select seats',M.empty('This bus is no longer available',''),{back:1});const st=AbraStore.seatStates(t),p=price(t),mx=DB().settings.booking.maxSeats,D=layoutOf(t),left=free(t);
const cell=x=>{if(x.c==='_')return'<span class="gap"></span>';if(x.i==null)return'<span style="width:42px"></span>';const l=AbraStore.seatLabelFor(t,x.i),s=st[x.i],sel=S.sel.includes(l),lad=s==='L'||x.c==='L',busy=['B','H','X'].includes(s);
return`<button class="st2 ${x.c==='B'?'berth':''} ${sel?'sel':busy?s:lad?'L':''}" data-a="seat" data-v="${l}" ${busy&&!sel?'disabled':''} aria-label="Seat ${l}, ${sel?'selected':s==='B'?'booked':s==='H'?'held':s==='X'?'blocked':lad?'ladies only':'available'}, ${money(price(t,l).seat)}">${l}<small>${busy?'':money(price(t,l).seat)}</small></button>`};
const deck=(cells,name,front)=>`<div class="deck"><div class="front"><b>${name}</b>${front?`<span>${ic('user',12)} Front</span>`:''}</div>${cells.map(r=>`<div class="srw">${r.map(cell).join('')}</div>`).join('')}</div>`;
return page('Select seats',`<div class="sm m">${esc(opOf(t).name)} · ${fdt(t.depart)} · ${esc(t.type)}</div>${left===0?M.empty('No seats left on this bus','Every seat of this trip is taken. Try another bus.'):''}
<div class="leg"><span><i></i>Available</span><span><i style="background:var(--g);border-color:var(--g)"></i>Selected</span><span><i style="background:#C9D3DC;border-color:#C9D3DC"></i>Booked</span><span><i style="border-color:#E86BB5"></i>Ladies only</span><span><i style="background:#F9C7C7;border-color:#EF4444"></i>Blocked</span></div>
<p class="sm m">Select up to ${mx} seats · ${S.sel.length}/${mx} chosen</p><div class="col" style="align-items:center">${D.map((c,i)=>deck(c,D.length>1?(i?'Upper deck':'Lower deck'):'Seats',i===0)).join('')}</div>`,
{back:1,foot:`<div class="botbar"><div class="grow"><b>${S.sel.length?S.sel.length+(S.sel.length>1?' seats':' seat')+' · '+S.sel.join(', '):'No seats selected'}</b><div class="sm m">Total ${money(S.sel.reduce((a,l)=>a+price(t,l).seat,0))}</div></div><button class="cta" data-a="hold" ${S.sel.length?'':'disabled'}>Continue</button></div>`})}
function releaseHold(){const t=T(S.trip);S.holdUntil=null;if(!t||!t.heldSeats)return;const mine=t.heldSeats.filter(h=>h.by===S.who);if(!mine.length)return;t.heldSeats=t.heldSeats.filter(h=>h.by!==S.who);t.held=Math.max(0,(t.held||0)-mine.length);save()}

/* ---------- boarding and dropping ---------- */
