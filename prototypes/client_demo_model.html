<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abra Partner Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ABRA TRAVELS - ADMIN PORTAL DEMO MODEL
   Mock data only. Everything is clickable. Sections:
   1 CSS  2 Core (state, helpers, router, shell)  3 Mock data
   4 Screens  5 Boot
   ===================================================================== */
:root{
  --n:#12304A;--b:#1677C8;--s:#36BDF5;--db:#0B4EA2;--lb:#E8F6FD;--lb2:#DDF3FC;
  --g:#1B8A5A;--gbg:#E1F4EA;--gtx:#12663F;--r:#EF4444;--rbg:#FDE8E8;--rtx:#B91C1C;
  --a:#F59E0B;--abg:#FEF3C7;--atx:#7A4B00;--bg:#F3F5F7;--card:#fff;--ln:#D7E0E7;
  --m:#66798A;--tx:#183247;--sh:0 8px 24px rgba(18,48,74,.08);--fld:#fff;--hov:#E8F6FD;
  --thead:#F8FAFB;--gr:linear-gradient(135deg,#12304A,#1677C8 58%,#36BDF5);--side:#12304A;
}
:root[data-theme=dark]{
  --bg:#0B1620;--card:#13222F;--ln:#2A3E50;--m:#9FB6C9;--tx:#E6EEF5;--fld:#0F1C27;--hov:#1B3347;
  --lb:#16314A;--lb2:#1D4268;--thead:#102030;--gbg:#123B2A;--gtx:#7EE0B0;--rbg:#4A1D1D;--rtx:#FFA6A6;
  --abg:#4A3A12;--atx:#FFD98A;--sh:0 8px 24px rgba(0,0,0,.35);--side:#0A1D2E;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 Inter,'Nirmala UI','Noto Sans Kannada','Noto Sans Tamil','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Devanagari','Noto Sans Telugu',Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #7DD8F7;outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
a{color:var(--b)}
.m{color:var(--m)}.sm{font-size:12px}.bd{font-weight:800}.tc{text-align:center}.tr{text-align:right}
.row{display:flex;align-items:center;gap:8px}.rw{flex-wrap:wrap}.bt{justify-content:space-between}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px}.mt2{margin-top:8px}
.hide{display:none!important}

/* shell */
#app{display:grid;grid-template-columns:262px 1fr;height:100vh}
.nav{background:var(--side);color:#fff;display:flex;flex-direction:column;overflow:auto;padding:14px 10px;gap:2px}
.nav .lg{font-weight:800;font-size:18px;padding:4px 12px 0;display:flex;align-items:center;gap:8px}
.nav .sl{font-size:12px;color:#9FB6C9;padding:0 12px 12px}
.nav .gh{font-size:11px;letter-spacing:.6px;color:#8FA9BF;padding:14px 12px 4px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:#D3E2EE;width:100%;text-align:left;position:relative}
.ni:hover{background:#ffffff14}.ni.on{background:var(--b);color:#fff;font-weight:800}
.ni .bdg{margin-left:auto;background:var(--r);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.ni.lock{opacity:.5}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:60px;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 20px;flex:none}
.top h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;flex:none;position:relative}
.ib:hover{background:var(--hov)}
.ib .dot{position:absolute;top:6px;right:5px;background:var(--r);color:#fff;border-radius:99px;font-size:10px;font-weight:800;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.gs{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;min-height:40px;padding:0 12px;min-width:200px;color:var(--m);width:min(340px,30vw)}
.rolechip{background:var(--lb2);color:var(--db);border-radius:99px;padding:4px 12px;font-weight:800;font-size:12px;white-space:nowrap}
.scroll{flex:1;overflow:auto}
.page{padding:22px;max-width:1360px;margin:auto}
.page>*+*{margin-top:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:24px}
.crumb{font-size:12px;color:var(--m);margin-bottom:4px}
.crumb a{cursor:pointer;color:var(--b)}
.menu-btn{display:none}
.backdrop{position:fixed;inset:0;background:rgba(18,48,74,.55);z-index:80}

/* cards / grids */
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.c>*+*{margin-top:10px}
.c h3{font-size:15px}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kc{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.kc .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--lb2);color:var(--db);flex:none}
.kc .v{font-size:21px;font-weight:800;line-height:1.1}.kc .l{font-size:12px;color:var(--m)}
.kc .d{font-size:11px;font-weight:700}.d.up{color:var(--gtx)}.d.dn{color:var(--rtx)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}

/* buttons */
.cta{min-height:44px;padding:0 16px;border-radius:12px;background:var(--b);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.cta:hover{background:var(--db)}.cta:active{transform:scale(.98)}
.cta.gr{background:var(--gr)}
.cta.gh{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.cta.gh:hover{background:var(--hov)}
.cta.dg{background:var(--r)}.cta.ok{background:var(--g)}
.cta.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.cta[disabled]{background:#B7C4CF;color:#fff;cursor:not-allowed;border:0}
.cta.gh[disabled]{background:var(--card);color:var(--m);border:1px solid var(--ln);opacity:.6}

/* fields */
.fd{background:var(--fld);border:1px solid var(--ln);border-radius:12px;padding:6px 12px;min-height:52px;display:block;transition:.15s}
.fd:focus-within{border-color:var(--s);box-shadow:0 0 0 3px #7DD8F7}
.fd label{display:block;font-size:12px;color:var(--m)}
.fd input,.fd select,.fd textarea{width:100%;border:0;outline:0;background:transparent;min-height:28px;padding:0}
.fd textarea{min-height:64px;resize:vertical}
.fd.err{border-color:var(--r)}
.hlp{font-size:12px;color:var(--m);margin-top:3px}.ehlp{font-size:12px;color:var(--rtx);margin-top:3px}
.sw{display:inline-grid;align-items:center;width:52px;height:44px;flex:none}
.sw i{width:48px;height:28px;border-radius:99px;background:#B7C4CF;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--g)}.sw.on i:after{left:23px}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.ckb{width:20px;height:20px;accent-color:var(--b)}

/* chips, status */
.st{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.st.g{background:var(--gbg);color:var(--gtx)}.st.n{background:#E5EAEE;color:#183247}.st.r{background:var(--rbg);color:var(--rtx)}
.st.a{background:var(--abg);color:var(--atx)}.st.b{background:var(--lb2);color:var(--db)}
:root[data-theme=dark] .st.n{background:#243A4D;color:#E6EEF5}
.ch{min-height:38px;padding:0 14px;border:1px solid var(--ln);border-radius:99px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ch.on{background:var(--lb2);border-color:var(--b);color:var(--db)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);overflow:auto}
.tabs button{min-height:46px;padding:0 16px;font-weight:600;color:var(--m);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button.on{color:var(--db);border-color:var(--b);font-weight:800}
:root[data-theme=dark] .tabs button.on{color:var(--s)}
.hb{background:var(--abg);color:var(--atx);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-weight:600}
.hb.b{background:var(--lb);color:var(--db)}.hb.r{background:var(--rbg);color:var(--rtx)}.hb.g{background:var(--gbg);color:var(--gtx)}
:root[data-theme=dark] .hb.b{color:#9ED8FF}

/* tables */
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.tbar .fd{min-width:150px;flex:1;max-width:230px}.tbar .fd.q{max-width:340px;flex:2}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
table.dt{width:100%;border-collapse:collapse;min-width:760px}
.dt th{text-align:left;font-size:12px;color:var(--m);padding:10px 14px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--thead);position:sticky;top:0}
.dt th.s{cursor:pointer;user-select:none}
.dt td{padding:11px 14px;border-bottom:1px solid var(--ln);vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr[data-a]{cursor:pointer}.dt tbody tr[data-a]:hover td{background:var(--hov)}
.pgn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;flex-wrap:wrap}
.bulk{background:var(--lb2);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* modal, toast, popovers */
.mdl{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(18,48,74,.55);padding:16px}
.md{background:var(--card);border-radius:16px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px #0006}
.md.wide{width:min(1040px,100%)}.md.sm2{width:min(460px,100%)}
.md header{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:8px}
.md header h3{font-size:17px}
.md .bd2{padding:18px 20px;overflow:auto;flex:1}.md .bd2>*+*{margin-top:12px}
.md footer{padding:12px 20px;border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{background:var(--n);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;box-shadow:0 10px 30px #0004;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast button{color:#7DD8F7;font-weight:800}
.pop{position:absolute;right:8px;top:54px;background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 50px #0004;width:min(380px,92vw);max-height:70vh;overflow:auto;z-index:90}
.pop .it{padding:12px 14px;border-bottom:1px solid var(--ln);display:flex;gap:10px;cursor:pointer}
.pop .it:hover{background:var(--hov)}.pop .it.un{background:var(--lb)}
.skel{background:linear-gradient(90deg,#E5EAEE 25%,#F3F5F7 50%,#E5EAEE 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:90px}
:root[data-theme=dark] .skel{background:linear-gradient(90deg,#1B2E3E 25%,#243C50 50%,#1B2E3E 75%);background-size:200% 100%}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px;color:var(--m)}
.empty .big{width:64px;height:64px;border-radius:50%;background:var(--lb2);color:var(--db);display:grid;place-items:center;margin:0 auto 10px}
.banner-off{background:#7A4B00;color:#fff;text-align:center;padding:8px;font-weight:700}

/* demo panel */
#demoBtn{position:fixed;right:18px;bottom:14px;z-index:150;background:var(--gr);color:#fff;border-radius:99px;padding:0 16px;min-height:44px;font-weight:800;box-shadow:0 10px 30px #0005;display:flex;align-items:center;gap:8px}
#demo{position:fixed;right:18px;bottom:66px;z-index:150;width:min(340px,92vw);max-height:78vh;overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:0 20px 60px #0005;padding:14px}
#demo h4{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
#demo .row.rw>button{flex:1 1 45%}

/* charts and visuals */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--m);font-size:10px}
.bar{height:10px;border-radius:99px;background:var(--lb2);overflow:hidden}.bar i{display:block;height:100%;background:var(--b);border-radius:99px}
.map{position:relative;background:linear-gradient(135deg,#DDF3FC,#E8F6FD);border:1px solid var(--ln);border-radius:14px;overflow:hidden;min-height:340px}
:root[data-theme=dark] .map{background:linear-gradient(135deg,#143049,#102536)}
.map svg{width:100%;height:100%;position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--n);color:#fff;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 4px 12px #0004}
.pin.red{background:var(--r)}.pin.amb{background:var(--a);color:#222}.pin.grn{background:var(--g)}
.tl{border-left:2px solid var(--ln);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;padding:0 0 12px}.tl .ev:before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--b);border:2px solid var(--card)}
.tl .ev.r:before{background:var(--r)}.tl .ev.g:before{background:var(--g)}.tl .ev.a:before{background:var(--a)}
.phone{width:280px;border:8px solid #17232F;border-radius:30px;background:var(--bg);padding:12px;margin:auto}
.ban{border-radius:16px;padding:16px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.kv dt{color:var(--m)}.kv dd{margin:0;font-weight:600}
.doc{border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--card)}
.sirenpulse{animation:pl 1s infinite}@keyframes pl{50%{opacity:.35}}

/* clickable visuals */
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:rgba(22,119,200,.10)}
.arc{cursor:pointer;transition:.15s}.arc:hover{stroke-width:22}
.barrow,.legbtn{display:block;width:100%;text-align:left;border-radius:8px;padding:3px 4px}.legbtn{display:flex;width:auto}
.barrow:hover,.legbtn:hover{background:var(--hov)}
.kpi{cursor:pointer;transition:.15s}.kpi:hover{border-color:var(--s);transform:translateY(-1px)}
.chint{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:11px}
.xcard{border-radius:14px;background:var(--lb);padding:14px;border:1px solid var(--ln)}
.xstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.xstat>div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.xstat b{display:block;font-size:18px}
/* table or list view */
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{min-height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--m)}
.seg button.on{background:var(--lb2);color:var(--db);font-weight:800}
.tw.lv{border:0;background:transparent;overflow:visible}
.tw.lv table.dt{min-width:0}.tw.lv thead{display:none}
.tw.lv tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tw.lv tr{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);gap:6px}
.tw.lv td{display:block;position:relative;padding:0 0 0 118px;border:0;min-width:0;overflow-wrap:anywhere}
.tw.lv td:before{content:attr(data-l);color:var(--m);font-size:12px;position:absolute;left:0;top:2px;width:110px}
.tw.lv td.c1{padding-left:0;font-size:15px}.tw.lv td.c1:before{display:none}
.tw.lv td.nolab{padding-left:0}.tw.lv td.nolab:before{display:none}
.tw.lv td.ckc{padding-left:0}.tw.lv td.ckc:before{display:none}
.tw.lv tr[data-a]:hover{border-color:var(--s)}.tw.lv tr[data-a]:hover td{background:none}
.racts{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.racts .ib{width:36px;height:36px}
.racts .ib.del{color:var(--rtx)}
/* permission matrix */
.pm select{border:1px solid var(--ln);border-radius:8px;min-height:34px;padding:0 6px;background:var(--fld);font-weight:700}
.pm select.NONE{color:var(--m)}.pm select.VIEW{color:var(--db)}.pm select.EDIT{color:var(--atx)}.pm select.FULL{color:var(--gtx)}
.pm td.grp{background:var(--thead);font-weight:800;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.5px}
.pm th{white-space:normal;min-width:120px}
.lvl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lvl>div{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:var(--card)}
.langsel{display:flex;align-items:center;gap:4px;border:1px solid var(--ln);border-radius:10px;min-height:40px;padding:0 6px;color:var(--m)}
.langsel select{border:0;background:transparent;font-weight:700;color:var(--tx);outline:0}
.page{padding-bottom:90px}

@media(max-width:1100px){
  #app{grid-template-columns:76px 1fr}
  .nav .l,.nav .lg span,.nav .sl,.nav .gh,.ni .bdg{display:none}.ni{justify-content:center;padding:0}
  .kg{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1fr}
  .gs{display:none}
}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  .nav{position:fixed;z-index:90;inset:0 auto 0 0;width:276px;transform:translateX(-105%);transition:.25s}
  .nav.open{transform:none}
  .nav .l,.nav .lg span,.nav .sl,.nav .gh{display:revert}.ni{justify-content:flex-start;padding:0 12px}.ni .bdg{display:revert}
  .menu-btn{display:grid}.top{padding:0 8px}.page{padding:14px}.ph h1{font-size:20px}
  .g2,.g3,.fgrid,.kg{grid-template-columns:1fr}.kg{grid-template-columns:repeat(2,1fr)}
  .tbar .fd{max-width:none;min-width:0;flex:1 1 calc(50% - 6px)}.tbar .fd.q{max-width:none;flex:1 1 100%}.kv{grid-template-columns:1fr}
  .rolechip{display:none}
}
/* AI assistant panel */
#ai{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:95;background:var(--card);border-left:1px solid var(--ln);box-shadow:-20px 0 60px #0004;display:none;flex-direction:column}
#ai.open{display:flex}
.aihd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--gr);color:#fff}
.aihd .m{color:#DDF3FC}.aihd .ib{color:#fff}.aihd .ib:hover{background:#ffffff22}
.aiic{width:34px;height:34px;border-radius:10px;background:#ffffff26;display:grid;place-items:center;flex:none}
.aibody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:92%;border-radius:14px;padding:10px 12px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--b);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--ln);border-bottom-left-radius:4px;width:94%}
.msg.ai>*+*{margin-top:10px}
.msg table.dt{min-width:0;font-size:12.5px}.msg .dt td,.msg .dt th{padding:6px 8px}
.dt tr.warn td{background:var(--abg)}
.aisug{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--ln);flex:none}
.aisug button,.chips button{white-space:nowrap;border:1px solid var(--ln);border-radius:99px;padding:6px 11px;font-size:12px;background:var(--card);font-weight:600;color:var(--db)}
.aisug button:hover,.chips button:hover{background:var(--hov)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.aiin{display:flex;gap:6px;align-items:flex-end;padding:8px 12px 4px;flex:none}

function setErr(id,msg){const w=$('#w_'+id),e=$('#e_'+id);if(w)w.classList.toggle('err',!!msg);if(e){e.textContent=msg||'';e.classList.toggle('hide',!msg)}return!msg}

const kc=(i,v,l,d,up)=>`<div class="kc kpi" data-a="kpi" data-v="${esc(l)}|${esc(String(v))}|${esc(d||'')}" title="Click to explain" role="button" tabindex="0"><div class="ico">${ic(i)}</div><div><div class="v">${v}</div><div class="l">${l}</div>${d?`<div class="d ${up===false?'dn':'up'}">${d}</div>`:''}</div></div>`;

/* ---------- csv ---------- */
function csv(name,cols,rows){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const t=[cols.map(c=>q(c.label)).join(',')].concat(rows.map(r=>cols.map(c=>q(c.x?c.x(r):(c.v?c.v(r):r[c.k]))).join(','))).join('\n');
try{const b=new Blob([t],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove();toast('Exported '+rows.length+' rows to '+name+'.csv')}catch(e){toast('Export started ('+rows.length+' rows)')}}

/* ---------- generic table with filters, sort, paging, bulk, export ---------- */
function tbl(id,cols,rows,o={}){
const T=(S.t[id]=S.t[id]||{q:'',f:{},s:o.sort||null,d:o.dir||1,p:0,sel:{}});
if(S.sim==='error')return errBox();
let r=S.sim==='empty'?[]:rows.slice();
(o.filters||[]).forEach(f=>{const v=T.f[f.k];if(v&&v!=='ALL')r=r.filter(x=>f.fn?f.fn(x,v):String(x[f.k])===v)});
if(T.q){const q=T.q.toLowerCase();r=r.filter(x=>(o.search?o.search(x):JSON.stringify(x)).toLowerCase().includes(q))}
if(T.s){const c=cols.find(c=>c.k===T.s);if(c){const g=c.v||(x=>x[c.k]);r.sort((a,b)=>{const A=g(a),B=g(b);return(A>B?1:A<B?-1:0)*T.d})}}
S.exp[id]={cols:o.ecols||cols.filter(c=>c.k!=='_act'),rows:r,name:o.exp||id};
const ps=o.ps||10,pages=Math.max(1,Math.ceil(r.length/ps));if(T.p>=pages)T.p=pages-1;const pr=r.slice(T.p*ps,T.p*ps+ps);
const selN=Object.keys(T.sel).filter(k=>T.sel[k]).length;
const bar=`<div class="tbar">${o.noq?'':`<div class="fd q"><label for="q_${id}">Search</label><input id="q_${id}" data-tq="${id}" value="${esc(T.q)}" placeholder="${esc(o.ph||'Search')}" autocomplete="off"></div>`}${(o.filters||[]).map(f=>`<div class="fd"><label for="f_${id}_${f.k}">${esc(f.l)}</label><select id="f_${id}_${f.k}" data-tf="${id}|${f.k}">${[['ALL','All']].concat(f.opts).map(x=>{const a=Array.isArray(x)?x:[x,lab(x)];return`<option value="${esc(a[0])}" ${(T.f[f.k]||'ALL')===String(a[0])?'selected':''}>${esc(a[1])}</option>`}).join('')}</select></div>`).join('')}
<button class="cta gh sm" data-a="t_clr" data-v="${id}">${ic('x',14)} Clear</button>${o.exp!==false?`<button class="cta gh sm" data-a="t_exp" data-v="${id}">${ic('download',14)} Export CSV</button>`:''}${o.tools||''}</div>`;
const bulk=o.bulk&&selN?`<div class="bulk"><b>${selN} selected</b>${o.bulk.map(b=>`<button class="cta sm ${b.c||'gh'}" data-a="${b.a}" data-v="${id}"${b.p?dis(b.p):''}>${esc(b.l)}</button>`).join('')}<button class="cta gh sm" data-a="t_clr_sel" data-v="${id}">Deselect</button></div>`:'';
const head=`<tr>${o.bulk?`<th style="width:42px"><input type="checkbox" class="ckb" aria-label="Select page" data-tsall="${id}" ${pr.length&&pr.every(x=>T.sel[x.id])?'checked':''}></th>`:''}${cols.map(c=>`<th class="${c.v||(!c.nosort&&c.k!=='_act')?'s':''}" ${c.nosort||c.k==='_act'?'':`data-ts="${id}|${c.k}"`} ${T.s===c.k?`aria-sort="${T.d>0?'ascending':'descending'}"`:''}>${esc(c.l)}${T.s===c.k?(T.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
const body=pr.map(x=>`<tr ${o.row?`data-a="${o.row}" data-v="${esc(x.id)}" tabindex="0"`:''}>${o.bulk?`<td><input type="checkbox" class="ckb" aria-label="Select row" data-tsel="${id}|${esc(x.id)}" ${T.sel[x.id]?'checked':''}></td>`:''}${cols.map(c=>`<td>${c.r?c.r(x):esc(x[c.k])}</td>`).join('')}</tr>`).join('');
const anyF=T.q||Object.values(T.f).some(v=>v&&v!=='ALL');
const tb=pr.length?`<div class="tw"><table class="dt"><thead>${head}</thead><tbody>${body}</tbody></table></div>`:`<div class="tw">${empty(anyF?'No results for these filters':(o.emptyT||'Nothing here yet'),anyF?'Try a different search or clear the filters.':(o.emptyS||'New items will appear here.'),anyF?`<button class="cta gh mt2" data-a="t_clr" data-v="${id}">Clear filters</button>`:'')}</div>`;
return`${bar}${bulk}${tb}<div class="pgn"><span class="m sm">${r.length} result${r.length===1?'':'s'}${S.sim==='empty'?' (empty state simulation is on)':''}</span><div class="row"><button class="cta gh sm" data-a="t_pg" data-v="${id}|-1" ${T.p<=0?'disabled':''}>${ic('chevL',14)} Previous</button><span class="sm">Page ${T.p+1} of ${pages}</span><button class="cta gh sm" data-a="t_pg" data-v="${id}|1" ${T.p>=pages-1?'disabled':''}>Next ${ic('chevR',14)}</button></div></div>`}
const selIds=id=>Object.keys((S.t[id]||{}).sel||{}).filter(k=>S.t[id].sel[k]);

/* ---------- charts ---------- */
function lineChart(series,labels,o={}){const W=640,H=o.h||200,pl=44,pb=24,pt=10,pr=10,max=Math.max(1,...series.flatMap(s=>s.d))*1.1;
const X=i=>pl+(W-pl-pr)*i/(Math.max(1,labels.length-1)),Y=v=>pt+(H-pt-pb)*(1-v/max);
const grid=[0,.25,.5,.75,1].map(f=>{const y=pt+(H-pt-pb)*(1-f);return`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${o.fmt?o.fmt(max*f):Math.round(max*f)}</text>`}).join('');
const step=Math.ceil(labels.length/8);const xl=labels.map((l,i)=>i%step?'':`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`).join('');
const cols=['#1677C8','#36BDF5','#1B8A5A','#F59E0B'];
const lines=series.map((s,k)=>`<polyline fill="none" stroke="${cols[k%4]}" stroke-width="2.5" points="${s.d.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+(o.area&&k===0?`<polygon fill="${cols[0]}" opacity=".1" points="${pl},${H-pb} ${s.d.map((v,i)=>X(i)+','+Y(v)).join(' ')} ${W-pr},${H-pb}"/>`:'')).join('');
const leg=series.length>1?`<div class="row rw sm" style="margin-top:6px">${series.map((s,k)=>`<span class="row"><i style="width:12px;height:12px;border-radius:3px;background:${cols[k%4]}"></i>${esc(s.n)}</span>`).join('')}</div>`:'';
/* every point, bar and slice is clickable: CH keeps this render's chart data so the click can open an explanation card */
const ci=CH.push({type:'line',series,labels,o})-1,cw=(W-pl-pr)/Math.max(1,labels.length-1);
const dots=series.map((s,k)=>s.d.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${cols[k%4]}"/>`).join('')).join('');
const hits=labels.map((l,i)=>`<rect class="hit" x="${Math.max(pl,X(i)-cw/2)}" y="${pt}" width="${cw}" height="${H-pt-pb}" data-a="chart_pt" data-v="${ci}|${i}"><title>${esc(l)}: ${series.map(s=>esc(s.n)+' '+(o.fmt?o.fmt(s.d[i]):num(Math.round(s.d[i])))).join(', ')} - click to explain</title></rect>`).join('');
return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.t||'Line chart')}">${grid}${xl}${lines}${dots}${hits}</svg>${leg}<div class="sm m chint">${ic('info',12)} Click any point to see what it means</div>`}
function barChart(items,o={}){const max=Math.max(1,...items.map(i=>i.v)),ci=CH.push({type:'bar',items,o})-1;return`<div class="col" style="gap:8px">${items.map((i,k)=>`<button class="barrow" data-a="chart_pt" data-v="${ci}|${k}" title="Click to explain"><div class="row bt sm"><span>${esc(i.l)}</span><b>${o.fmt?o.fmt(i.v):num(i.v)}</b></div><div class="bar"><i style="width:${Math.max(2,i.v/max*100)}%;${i.c?`background:${i.c}`:''}"></i></div></button>`).join('')}</div><div class="sm m chint">${ic('info',12)} Click any bar to see what it means</div>`}
function donut(items,o={}){const tot=items.reduce((a,b)=>a+b.v,0)||1,cols=['#1677C8','#36BDF5','#1B8A5A','#F59E0B','#EF4444','#7C5CFF'];let a=0;const R=48,C=2*Math.PI*R,ci=CH.push({type:'donut',items,o})-1;
const arcs=items.map((i,k)=>{const f=i.v/tot,d=`<circle class="arc" r="${R}" cx="60" cy="60" fill="none" stroke="${cols[k%6]}" stroke-width="18" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-a*C}" transform="rotate(-90 60 60)" data-a="chart_pt" data-v="${ci}|${k}"><title>${esc(i.l)}: ${num(i.v)} - click to explain</title></circle>`;a+=f;return d}).join('');
return`<div class="row rw" style="gap:16px"><svg viewBox="0 0 120 120" width="130" height="130" role="img" aria-label="Donut chart">${arcs}<text x="60" y="64" text-anchor="middle" style="font-size:16px;font-weight:800;fill:var(--tx);pointer-events:none">${num(tot)}</text></svg><div class="col sm" style="gap:6px">${items.map((i,k)=>`<button class="row legbtn" data-a="chart_pt" data-v="${ci}|${k}"><i style="width:12px;height:12px;border-radius:3px;background:${cols[k%6]}"></i>${esc(i.l)} <b>${num(i.v)}</b></button>`).join('')}</div></div><div class="sm m chint">${ic('info',12)} Click a slice or a label to see what it means</div>`}
/* abstract map: stops are percent coordinates */
function mapBox(pins,o={}){return`<div class="map" style="min-height:${o.h||340}px" role="img" aria-label="Map placeholder">
<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><pattern id="gp" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="var(--ln)" stroke-width=".2"/></pattern></defs><rect width="100" height="100" fill="url(#gp)"/>
${(o.routes||[]).map(r=>`<polyline fill="none" stroke="#1677C8" stroke-width=".7" stroke-dasharray="1.5 1" points="${r.map(p=>p.join(',')).join(' ')}"/>`).join('')}</svg>
${pins.map(p=>`<div class="pin ${p.c||''}" style="left:${p.x}%;top:${p.y}%" ${p.a?`data-a="${p.a}" data-v="${p.v}"`:''} title="${esc(p.t||'')}">${esc(p.l)}</div>`).join('')}
<div class="sm m" style="position:absolute;left:10px;bottom:8px;background:var(--card);padding:3px 8px;border-radius:8px">Map placeholder - real map after provider and key are chosen</div></div>`}

function checkRow(spec,r){const e=[];spec.req.forEach(c=>{const i=spec.cols.indexOf(c);if(!String(r[i]||'').trim())e.push(c+' is empty')});
if(spec===IMPORTS.buses){if(r[0]&&!/^[A-Z]{2}\s?\d{2}\s?[A-Z]{1,3}\s?\d{4}$/i.test(r[0]))e.push('registration number looks wrong');if(r[3]&&!(Number(r[3])>0&&Number(r[3])<=100))e.push('seats must be 1 to 100');if(r[0]&&DB.buses.some(b=>b.reg.replace(/\s/g,'')===String(r[0]).replace(/\s/g,'')))e.push('registration already exists')}
if(spec===IMPORTS.places&&r[0]&&r[1]&&DB.places.some(p=>p.name.toLowerCase()===r[0].toLowerCase()&&p.city===r[1]))e.push('place already exists in this city');return e}

function drawImp(){const k=S.imp.k,sp=IMPORTS[k];let body;
if(!S.imp.rows)body=`<p>Upload a CSV file with these columns: <b>${sp.cols.join(', ')}</b>. Excel files can be saved as CSV first.</p><div class="doc tc"><input type="file" id="impf" accept=".csv,.xlsx,.xls" data-ch="imp_file"><p class="sm m mt2">or</p><button class="cta gh" data-a="imp_sample">Use sample file (has some bad rows)</button><button class="cta gh" data-a="imp_tpl" style="margin-left:8px">${ic('download',16)} Download template</button></div>`;
else{const rows=S.imp.rows.map(r=>({r,e:checkRow(sp,r)}));const ok=rows.filter(x=>!x.e.length).length;
body=`${hb(`<b>${ok}</b> row${ok===1?'':'s'} are valid, <b>${rows.length-ok}</b> have problems and will be skipped.`,rows.length-ok?'':'g')}<div class="tw"><table class="dt" style="min-width:0"><thead><tr><th>#</th>${sp.cols.map(c=>`<th>${c}</th>`).join('')}<th>Result</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+2}</td>${sp.cols.map((c,j)=>`<td>${esc(x.r[j])}</td>`).join('')}<td>${x.e.length?`<span class="st r">${esc(x.e.join('; '))}</span>`:'<span class="st g">OK</span>'}</td></tr>`).join('')}</tbody></table></div><label class="row mt2"><input type="checkbox" class="ckb" ${S.imp.dry?'checked':''} data-ch="imp_dry"> Dry run only (check, do not save)</label>`}
openModal({t:sp.title,w:'wide',b:body,f:`<button class="cta gh" data-a="mdl_x">Cancel</button>${S.imp.rows?`<button class="cta" data-a="imp_go">${S.imp.dry?'Run check':'Import valid rows'}</button>`:''}`})}

A.imp_file=(v,el)=>{const f=el.files[0];if(!f)return;if(!/\.csv$/i.test(f.name)){toast('Demo reads CSV only. Save the Excel file as CSV, or use the sample.');return}const rd=new FileReader();rd.onload=()=>{const L=String(rd.result).split(/\r?\n/).filter(Boolean).slice(1);S.imp.rows=L.map(l=>l.split(',').map(c=>c.replace(/^"|"$/g,'')));drawImp()};rd.readAsText(f)};

function ruleOk(c,ans){if(!c||/^always$/i.test(c))return true;let m=c.match(/^(\w+)\s*=\s*(.+)$/);if(m)return String(ans[m[1]]||'')===m[2].trim();m=c.match(/^(\w+)\s+includes\s+(.+)$/);if(m)return[].concat(ans[m[1]]||[]).includes(m[2].trim());return true}
function kDocs(){const ans=kd().answers;return DB.docTypes.filter(d=>d.applies==='OPERATOR'&&d.active).map(d=>{const rs=DB.rules.filter(r=>r.active&&r.doc===d.key);if(!rs.length)return{...d,need:d.required};const hit=rs.filter(r=>ruleOk(r.cond,ans));return hit.length?{...d,need:hit.some(r=>r.required)}:null}).filter(Boolean)}
const chipQ=(q,v,on)=>`<button class="ch ${on?'on':''}" data-a="kq" data-v="${esc(q.key+'|'+v)}">${esc(v)}</button>`;
function qHtml(q){const a=kd().answers[q.key];let i;
if(q.type==='BOOLEAN')i=['Yes','No'].map(v=>chipQ(q,v,a===v)).join('');
else if(q.type==='SINGLE_CHOICE')i=q.opts.split(',').map(x=>x.trim()).map(v=>chipQ(q,v,a===v)).join('');
else if(q.type==='MULTI_CHOICE')i=q.opts.split(',').map(x=>x.trim()).map(v=>chipQ(q,v,[].concat(a||[]).includes(v))).join('');
else i=`<input class="kin" data-live="kq_in" data-k="${q.key}" type="${q.type==='NUMBER'?'number':'text'}" value="${esc(a||'')}" aria-label="${esc(q.label)}">`;
return`<div class="kq"><b>${esc(q.label)}${q.required?' *':` <span class="m sm">(optional)</span>`}</b><div class="row rw mt2">${i}</div></div>`}

else{const Q=kQs(),D=kDocs(),qOk=Q.filter(q=>q.required).every(q=>{const a=kd().answers[q.key];return a&&[].concat(a).length}),dOk=D.filter(d=>d.need).every(d=>kd().docs[d.key]);
const stp=`<div class="steps3">${['Your company','Documents','Submit'].map((l,i)=>`<button class="${step===i+1?'on':''} ${i+1<step?'done':''}" data-a="kstep" data-v="${i+1}"><span>${i+1<step?ic('check',14):i+1}</span>${l}</button>`).join('')}</div>`;

if(step===2)b=stp+`<div class="g2">${D.map(d=>{const f=kd().docs[d.key];return`<div class="c"><div class="row bt"><b>${esc(d.name)}${d.need?' *':' <span class="m sm">(optional)</span>'}</b>${f?chip('Uploaded','b'):chip('Not uploaded','n')}</div><p class="sm m">${esc(d.instr)} · ${esc(d.types)}, up to ${d.maxMb} MB</p>${f?`<div class="doc sm">${ic('file',14)} ${esc(f.file)}</div>`:''}<button class="cta sm gh" data-a="kd_up" data-v="${d.key}">${ic('upload',14)} ${f?'Replace':'Upload'}</button></div>`}).join('')}</div><div class="row"><button class="cta gh" data-a="kstep" data-v="1">${ic('chevL',16)} Edit answers</button><button class="cta" data-a="kstep" data-v="3" ${dOk?'':'disabled'}>Review and submit ${ic('chevR',16)}</button></div>`;
if(step===3)b=stp+`<div class="c">${kvl(Object.fromEntries(Q.map(q=>[q.label,esc([].concat(kd().answers[q.key]||'-').join(', '))])))}<h4 class="mt">Documents</h4>${D.filter(d=>kd().docs[d.key]).map(d=>`<div class="sm">${ic('check',14)} ${esc(d.name)}: ${esc(kd().docs[d.key].file)}</div>`).join('')}</div>${hb('After you submit, your answers and documents are locked until Abra decides.','b','lock')}<div class="row"><button class="cta gh" data-a="kstep" data-v="2">${ic('chevL',16)} Back</button><button class="cta ok" data-a="kd_submit">Submit for verification</button></div>`}
return`<div class="page">${ph('KYC verification',st==='APPROVED'?'Verified':st==='PENDING'?'Waiting for Abra':st==='REJECTED'?'Needs fixing':'Step '+step+' of 3','',[['Company'],['KYC']])}${st!=='APPROVED'?hb('Dashboard, buses, trips and sales open after Abra approves your company.','b','lock'):''}${b}</div>`});

/* ===================== 4b. ENHANCEMENTS =====================
   Access guard (None / View / Edit / Edit + Delete), add-view-edit-delete on every list,
   table or list view, explanation cards for charts and numbers, roles editor,
   horizontal / vertical layout, full-screen translation. */

/* ---------- which actions need which access ---------- */
const SAFE_A=new Set('nav go menu theme bell acct mdl_x mdl_bg cb_ok undo tab t_clr t_clr_sel t_pg t_exp sim_ok offline_off n_all n_open signout role mfa mfa_ok gsearch gs_run gs_go demo_toggle lang lang_sel sim ev relogin imp_sample imp_dry imp_tpl imp_file range dash_exp copy tel replay rrange print q_exp of_test pre_run com_calc snd kpi chart_pt x_go x_exp vw orient rec_view file_view pf_pick dr_open dc_open'.split(' '));
const DEL_A=new Set('rec_del slab_del sf_del role_del'.split(' '));
const actKind=a=>DEL_A.has(a)?'del':(SAFE_A.has(a)||/(_open|_view|_sel|_hist|_exp|_stmt|_payfile|_gst|_calc|_test)$|^trk_/.test(a))?'safe':'edit';
const allowed=k=>k==='safe'||(k==='edit'?canEdit(S.route):canDel(S.route));
const denyMsg=k=>k==='del'?'Your role cannot delete here. Deleting needs Edit + Delete access.':'Your role can only view this page.';
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.closest('.nav,#demo,.top'))return;const k=actKind(el.dataset.a);if(!allowed(k)){e.stopImmediatePropagation();e.preventDefault();toast(denyMsg(k))}},true);
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.ch||t.closest('.top,#demo'))return;const k=actKind(t.dataset.ch);if(!allowed(k)){e.stopImmediatePropagation();toast(denyMsg(k));render()}},true);

/* hide what the role cannot use, and say what access the person has */
function applyAccess(root){
$$('[data-a]',root).forEach(el=>{if(el.closest('.nav,#demo,.top'))return;const k=actKind(el.dataset.a);if(allowed(k))return;

const B=myBk().slice().sort((a,b)=>new Date(b.at)-new Date(a.at)),T=myTrips();
if(l==='Bookings today'){const a=B.filter(b=>sameDay(b.at,NOW));return D('Bookings made today',['PNR','Passenger','Route','Amount','Status'],a.slice(0,8).map(b=>[b.pnr,b.customer,b.route,money(b.amount),lab(b.status)]),a.length,'bookings','No bookings today yet.','Tickets sold on your buses since midnight.','Counted when the customer payment succeeds.')}
if(l==='Your earnings, 7 days'){const days=Array.from({length:7},(_,i)=>new Date(NOW-i*DAY));const r=days.map(d=>{const a=B.filter(b=>sameDay(b.at,d)&&b.status!=='CANCELLED');return[fd(d),a.length,money(a.reduce((s,b)=>s+b.amount-b.commission,0))]});return D('Earnings by day (after commission)',['Day','Bookings','You get'],r,r.length,'earnings',null,'What you earn from tickets in the last 7 days.','Ticket fare minus the Abra commission, cancelled bookings left out.')}
if(l==='Average occupancy'){const a=T.filter(t=>t.status!=='DRAFT'&&t.status!=='CANCELLED').sort((x,y)=>y.booked/y.seats-x.booked/x.seats);return D('Occupancy by trip',['Trip','Route','Departs','Seats sold'],a.slice(0,8).map(t=>[t.id,t.route,fdt(t.depart),t.booked+'/'+t.seats+' ('+Math.round(t.booked/t.seats*100)+'%)']),a.length,'trips',null,'How full your buses are on average.','Seats sold divided by seats on sale.')}
if(l==='Upcoming trips'){const a=T.filter(t=>new Date(t.depart)>NOW&&t.status!=='CANCELLED').sort((x,y)=>new Date(x.depart)-new Date(y.depart));return D('Next departures',['Trip','Route','Departs','Status'],a.slice(0,8).map(t=>[t.id,t.route,fdt(t.depart),lab(t.status)]),a.length,'trips',null,'Trips that have not left yet.','Scheduled or draft trips with a departure in the future.')}
if(l==='Active buses'){const a=myBuses().filter(b=>b.status==='ACTIVE');return D('Your active buses',['Registration','Name','Type','Seats'],a.slice(0,8).map(b=>[b.reg,b.name,b.type,b.seats]),a.length,'buses',null,'Buses approved and ready for trips.','Status Active. Pending and retired buses are not counted.')}
if(l==='Buses live now'){const a=DB.live.filter(x=>T.some(t=>t.id===x.tripId));return D('Your buses on the road',['Bus','Route','State','Speed'],a.map(x=>[x.bus,x.route,lab(x.state),x.speed+' km/h']),a.length,'live','No bus of yours is running right now.','Buses whose driver started the trip.','Location updates come from the driver app.')}
if(l==='Drivers on duty'){const a=myDrivers();return D('Active drivers',['Driver','Phone','Licence expires'],a.slice(0,8).map(s=>[s.name,s.phone||'-',s.licExp?fd(s.licExp):'-']),a.length,'crew',null,'Drivers who are active and can be given trips.','Role Driver and status Active.')}
return null}
A.kpi=v=>{const[l,val,d]=v.split('|'),k=KPI_INFO[l],dt=(typeof kpiDetail==='function')?kpiDetail(l):null;S.kd=dt;
const what=k?k[0]:(dt&&dt.what)||'This number is worked out from the records on this page.',how=k?k[1]:(dt&&dt.how)||'';
const tb=dt?`<h4 class="mt">${esc(dt.title)}</h4>${dt.rows.length?`<div class="tw"><table class="dt" style="min-width:0"><thead><tr>${dt.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${dt.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sm m mt2">Showing ${dt.rows.length} of ${dt.more}. ${dt.page&&PAGES[dt.page]?'Use the button below for the full list.':''}</p>`:`<p class="m">${esc(dt.none||'Nothing to list yet.')}</p>`}`:'';
openModal({t:l,w:dt?'wide':'sm2',b:`<div class="xcard"><div class="xstat"><div><span class="sm m">Value</span><b>${esc(val)}</b></div>${d?`<div><span class="sm m">Change</span><b>${esc(d)}</b></div>`:''}</div><h4 class="mt">What it counts</h4><p>${what}</p>${how?`<h4 class="mt">How it is worked out</h4><p>${how}</p>`:''}${tb}</div>`,f:`<button class="cta gh" data-a="mdl_x">Close</button>${dt&&dt.rows.length?`<button class="cta gh" data-a="kpi_exp">${ic('download',16)} Export this list</button>`:''}${dt&&dt.page&&PAGES[dt.page]&&canView(dt.page)?`<button class="cta" data-a="go" data-v="${dt.page}">View all ${dt.more} in ${esc(PAGES[dt.page].t)} ${ic('chevR',16)}</button>`:(!dt&&k&&PAGES[k[2]]&&canView(k[2])?`<button class="cta" data-a="go" data-v="${k[2]}">Open ${esc(PAGES[k[2]].t)} ${ic('chevR',16)}</button>`:'')}`})};
A.kpi_exp=()=>{const dt=S.kd;if(dt)csv('detail_'+dt.title.toLowerCase().replace(/[^a-z0-9]+/g,'_'),dt.cols.map((c,i)=>({label:c,x:r=>r[i]})),dt.rows)};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.kpi'))e.target.click()});

/* ---------- roles and the permission matrix ---------- */
const TONE_L={NONE:'n',VIEW:'b',EDIT:'a',FULL:'g'};
const permOk=r=>canEdit('staff')&&r!=='SUPER_ADMIN'&&(S.role==='SUPER_ADMIN'||r!==S.role);
function matrixHtml(){const R=Object.keys(ROLES),mg=canEdit('staff'),cust=r=>!['SUPER_ADMIN','ADMIN','SUPPORT','ACCOUNTS'].includes(r);
const cell=(r,p)=>{const L=lvl(p,r);if(!permOk(r))return`<span class="st ${TONE_L[L]}">${r==='SUPER_ADMIN'?ic('lock',12)+' ':''}${LEVEL_L[L]}</span>`;
return`<select class="${L}" data-ch="perm_set" data-k="${r}|${p}" aria-label="${esc(ROLES[r])}, ${esc(PAGES[p].t)}">${LEVELS.map(x=>`<option value="${x}" ${x===L?'selected':''}>${LEVEL_L[x]}</option>`).join('')}</select>`};
const head=`<tr><th>Area</th>${R.map(r=>`<th><div class="col" style="gap:6px"><b>${esc(ROLES[r])}</b>${r==='SUPER_ADMIN'?`<span class="sm m">${ic('lock',12)} Always full access</span>`:''}${permOk(r)?`<select data-ch="perm_all" data-k="${r}" aria-label="Set every area for ${esc(ROLES[r])}"><option value="">Set all to...</option>${LEVELS.map(x=>`<option value="${x}">${LEVEL_L[x]}</option>`).join('')}</select>`:''}${r===S.role&&r!=='SUPER_ADMIN'?'<span class="sm m">Your own role (locked)</span>':''}${mg&&cust(r)?`<div class="row">${sbtn('role_ren',r,'Rename','edit')}${sbtn('role_del',r,'Delete','trash')}</div>`:''}</div></th>`).join('')}</tr>`;
const body=GROUPS.map(([g,ids])=>{const ps=ids.filter(p=>PAGES[p]);return`<tr><td class="grp" colspan="${R.length+1}">${esc(g)}</td></tr>`+ps.map(p=>`<tr><td>${esc(PAGES[p].t)}</td>${R.map(r=>`<td>${cell(r,p)}</td>`).join('')}</tr>`).join('')}).join('');
return`${hb('<b>Owner has full access to everything:</b> every page, and every action on it, including view, add, edit, delete, import, export, approve and reject, money and settlements, settings and integrations, and staff, roles and access. This can never be reduced, and there must always be at least one active Owner.','g','shield')}
<div class="lvl">${[['NONE','The page is hidden from the menu.'],['VIEW','Can see the page and export. Cannot add, edit, import or delete.'],['EDIT','Can add, edit, import, export, approve and change status. Cannot delete.'],['FULL','Can do everything on the page, like the Owner, including delete.']].map(([k,t])=>`<div><span class="st ${TONE_L[k]}">${LEVEL_L[k]}</span><p class="sm mt2">${t}</p></div>`).join('')}</div>
<div class="row bt rw"><p class="sm m">${mg?'Change any cell to set that role\'s access to that area. Changes apply at once and are saved in the audit log. Whoever has Edit on Staff and roles can change access and create roles, but not for their own role.':'You can see the access of each role. Changing it needs Edit access to Staff and roles.'}</p>${mg?btn('role_new','','Add role','plus','sm'):''}</div>
<div class="tw pm"><table class="dt"><thead>${head}</thead><tbody>${body}</tbody></table></div>`}
A.perm_set=(v,el)=>{const[r,p]=el.dataset.k.split('|');if(!permOk(r))return toast('You cannot change this role');PERM[r][p]=v;savePerm();audit('Changed access: '+ROLES[r]+', '+PAGES[p].t+' to '+LEVEL_L[v],r);render();toast(ROLES[r]+': '+PAGES[p].t+' is now '+LEVEL_L[v])};
A.perm_all=(v,el)=>{const r=el.dataset.k;if(!v||!permOk(r))return;confirmD({t:'Set every area for '+ROLES[r],msg:'Every area for <b>'+esc(ROLES[r])+'</b> becomes <b>'+LEVEL_L[v]+'</b>.',ok:'Apply',run:()=>{ALLP.forEach(p=>PERM[r][p]=v);savePerm();audit('Changed all access for '+ROLES[r]+' to '+LEVEL_L[v],r);render()}});el.value=''};
function roleForm(name){return`<div class="fgrid">${fld('rn','Role name',name||'',{req:1,full:1,ph:'For example Operations manager'})}${name==null?fld('rc','Start with the access of','NONE_ALL',{type:'select',full:1,opts:[['NONE_ALL','No access (set it after)']].concat(Object.entries(ROLES).filter(([k])=>k!=='SUPER_ADMIN'))}):''}</div>${name==null?hb('After you add the role, set its access in the matrix, then give it to people in the Staff tab.','b','info'):''}`}
const roleNameOk=(n,except)=>{const t=n.trim().toLowerCase();if(!t)return'Role name is required';if(Object.entries(ROLES).some(([k,l])=>k!==except&&l.toLowerCase()===t))return'A role with this name already exists';return''};
A.role_new=()=>openModal({t:'Add role',w:'sm2',b:roleForm(),f:`<button class="cta gh" data-a="mdl_x">Cancel</button><button class="cta" data-a="role_save">Add role</button>`});
A.role_save=()=>{if(!chk([['rn','Role name',x=>roleNameOk(x)]]))return;const n=gv('rn').trim(),src=gv('rc');let key='R_'+n.toUpperCase().replace(/[^A-Z0-9]+/g,'_');while(ROLES[key])key+='_2';
ROLES[key]=n;PERM[key]={};ALLP.forEach(p=>PERM[key][p]=src==='NONE_ALL'?'NONE':lvl(p,src));savePerm();audit('Added role '+n,key);closeModal();render();toast('Role added: '+n)};
A.role_ren=v=>openModal({t:'Rename role',w:'sm2',b:roleForm(ROLES[v]),f:`<button class="cta gh" data-a="mdl_x">Cancel</button><button class="cta" data-a="role_ren_ok" data-v="${v}">Save</button>`});
A.role_ren_ok=v=>{if(!chk([['rn','Role name',x=>roleNameOk(x,v)]]))return;ROLES[v]=gv('rn').trim();savePerm();audit('Renamed role',v);closeModal();render()};
A.role_del=v=>{const n=DB.staff.filter(s=>s.role===v).length;if(n)return toast(n+' staff have this role. Move them to another role first.');if(S.role===v)return toast('You cannot delete your own role');
confirmD({t:'Delete role '+ROLES[v],msg:'Nobody has this role. It will be removed from the matrix.',ok:'Delete',tone:'dg',run:()=>{const nm=ROLES[v];delete ROLES[v];delete PERM[v];savePerm();audit('Deleted role '+nm,v);render()}})};

/* ---------- proof attachments: screenshots and files saved with an action, viewable and downloadable later ---------- */
const PF_MAX=600*1024,PF_TYPES=['image/png','image/jpeg','image/webp','image/gif','application/pdf','text/plain','text/csv'];
const fsize=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';
function proofField(id,req,label){return`<div class="full mt2"><div class="doc"><b>${esc(label||'Proof (screenshot or file)')}${req?' *':''}</b><p class="sm m">Attach a screenshot, photo, PDF or text file. It is saved with this action, and you can view or download it later. Up to 5 files, 600 KB each (pictures are shrunk automatically).</p><input type="file" id="f_${id}" multiple accept="image/*,application/pdf,.txt,.csv" data-ch="pf_pick"><div id="pfl_${id}" class="mt2 sm"></div><div class="ehlp hide" id="e_${id}"></div></div></div>`}
A.pf_pick=(v,el)=>{const l=document.getElementById('pfl_'+el.id.slice(2));if(!l)return;l.innerHTML=[...el.files].map(f=>`<div class="row"><span>${ic(/^image\//.test(f.type)?'image':'file',14)}</span><span class="grow">${esc(f.name)}</span><span class="m">${fsize(f.size)}</span></div>`).join('')};
const fileToData=f=>new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej(new Error('Could not read '+f.name));rd.onload=()=>{if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size<250*1024)return res({data:rd.result,type:f.type,size:f.size});
 const im=new Image();im.onerror=()=>res({data:rd.result,type:f.type,size:f.size});im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.72);res({data:d,type:'image/jpeg',size:Math.round(d.length*.75)})};im.src=rd.result};rd.readAsDataURL(f)});
async function readProofs(id,req){const inp=document.getElementById('f_'+id),fs=inp?[...inp.files]:[];
if(req&&!fs.length){setErr(id,'Attach at least one file as proof');return null}
if(fs.length>5){setErr(id,'Attach 5 files at most');return null}
const out=[];for(const f of fs){if(!PF_TYPES.includes(f.type)){setErr(id,f.name+': use a picture, PDF or text file');return null}
 let r;try{r=await fileToData(f)}catch(e){setErr(id,e.message);return null}
 if(r.size>PF_MAX){setErr(id,f.name+' is '+fsize(r.size)+'. The limit is 600 KB.');return null}out.push({name:f.name,...r})}
setErr(id,'');DB.files=DB.files||[];const ids=out.map(o=>{const fid=uid('FL');DB.files.push({id:fid,name:o.name,type:o.type,size:o.size,data:o.data,by:ROLES[S.role],at:new Date().toISOString()});return fid});return ids}
const fchips=ids=>(ids||[]).map(id=>{const f=(DB.files||[]).find(x=>x.id===id);return f?`<button class="ch" data-a="file_view" data-v="${esc(id)}">${ic(/^image\//.test(f.type)?'image':'file',14)} ${esc(f.name)} (${fsize(f.size)})</button>`:''}).join(' ');
const proofRow=(ids,label)=>ids&&ids.length?`<div class="mt2"><span class="sm m">${esc(label||'Proof')}</span><div class="row rw mt2">${fchips(ids)}</div></div>`:'';
function blobUrl(f){try{const p=f.data.split(','),b=atob(p[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:f.type}))}catch(e){return f.data}}
A.file_view=v=>{const f=(DB.files||[]).find(x=>x.id===v);if(!f)return toast('This file is no longer available');const u=blobUrl(f);let body;
if(/^image\//.test(f.type))body=`<img src="${f.data}" alt="${esc(f.name)}" style="max-width:100%;border-radius:12px;border:1px solid var(--ln)">`;
else if(f.type==='application/pdf')body=`<iframe src="${u}" title="${esc(f.name)}" style="width:100%;height:440px;border:1px solid var(--ln);border-radius:12px"></iframe>`;
else{let t='';try{t=decodeURIComponent(escape(atob(f.data.split(',')[1]||'')))}catch(e){try{t=atob(f.data.split(',')[1]||'')}catch(x){}}body=`<pre style="white-space:pre-wrap;max-height:420px;overflow:auto" class="doc">${esc(t)}</pre>`}
openModal({t:f.name,w:'wide',b:`${kvl({Size:fsize(f.size),Added:fdt(f.at),'Added by':esc(f.by)})}${body}`,f:`<button class="cta gh" data-a="mdl_x">Close</button><a class="cta" download="${esc(f.name)}" href="${u}">${ic('download',16)} Download</a>`})};

reg('dreports','Driver reports','file',()=>{const t=tab('dp','rep'),R=dReps(),M2=dMissing(),od=M2.filter(x=>x.state==='OVERDUE');let b='';
const opName=id=>(DB.operators.find(o=>o.id===id)||{}).name||'';
if(t==='rep')b=tbl('dpr',[{k:'typeName',l:'Report',r:x=>`<b>${esc(x.typeName)}</b><div class="sm m">${esc(perLabel(x))}</div>`,v:x=>x.typeName},{k:'driver',l:'Driver'},...(IS_ADMIN?[{k:'operatorId',l:'Operator',r:x=>esc(opName(x.operatorId)),v:x=>opName(x.operatorId)}]:[]),{k:'submittedAt',l:'Sent',r:x=>rel(x.submittedAt)+(x.late?' <span class="st r">Late</span>':''),v:x=>x.submittedAt},{k:'status',l:'Status',r:x=>sChip(x.status)},{k:'files',l:'Files',v:x=>Object.values(x.files||{}).flat().length,r:x=>Object.values(x.files||{}).flat().length||'-'}],R.filter(x=>x.status!=='DRAFT'),{filters:[{k:'status',l:'Status',opts:[['SUBMITTED','Waiting for review'],['APPROVED','Approved'],['RETURNED','Sent back']]},{k:'typeName',l:'Report',opts:[...new Set(R.map(r=>r.typeName))]},{k:'driver',l:'Driver',opts:[...new Set(R.map(r=>r.driver))]},...(IS_ADMIN?[{k:'operatorId',l:'Operator',opts:DB.operators.map(o=>[o.id,o.name])}]:[])],row:'dr_open',sort:'submittedAt',dir:-1,nocrud:1,exp:'driver_reports',ph:'Driver or report',search:x=>x.driver+x.typeName+x.period});
if(t==='mis')b=`${hb('Reports a driver should have sent but has not. The driver has a trip on that day or week.','b','info')}${tbl('dpm',[{k:'driver',l:'Driver',r:x=>`<b>${esc(x.driver)}</b>`},...(IS_ADMIN?[{k:'operator',l:'Operator'}]:[]),{k:'rname',l:'Report',r:x=>esc(x.type.name)+'<div class="sm m">'+esc(x.label)+'</div>',v:x=>x.type.name},{k:'due',l:'Due',r:x=>fdt(x.due),v:x=>+x.due},{k:'state',l:'Status',r:x=>sChip(x.state)},{k:'_act',l:'',r:x=>sbtn('dr_remind',x.key+'||'+x.driver,IS_ADMIN?'Tell the operator':'Remind the driver','bell','gh','dreports')}],M2.map(x=>({...x,id:x.key+'|'+x.driver,rname:x.type.name})),{noq:1,nocrud:1,exp:'missing_reports',emptyT:'Nobody is behind',emptyS:'Every driver is up to date.',filters:[{k:'state',l:'Status',opts:[['OVERDUE','Overdue'],['DUE','Due soon']]}]})}`;
if(t==='chk')b=tbl('dpc',[{k:'tripId',l:'Trip',r:x=>`<b>${esc(x.tripId)}</b><div class="sm m">${esc(x.route)}</div>`,v:x=>x.tripId},{k:'driver',l:'Driver'},...(IS_ADMIN?[{k:'operatorId',l:'Operator',r:x=>esc(opName(x.operatorId)),v:x=>opName(x.operatorId)}]:[]),{k:'kind',l:'When',r:x=>x.kind==='PRE'?'Before the trip':'After the trip',v:x=>x.kind},{k:'at',l:'Time',r:x=>fdt(x.at),v:x=>x.at},{k:'odometer',l:'Odometer',r:x=>x.odometer?num(x.odometer)+' km':'-'},{k:'result',l:'Result',r:x=>x.result==='PASSED'?chip('Passed','g'):x.result==='WARNINGS'?chip('Warnings','a'):chip('Started anyway','r')}],dChecks(),{filters:[{k:'result',l:'Result',opts:[['PASSED','Passed'],['WARNINGS','Warnings'],['OVERRIDDEN','Started anyway']]},{k:'kind',l:'When',opts:[['PRE','Before the trip'],['END','After the trip']]},...(IS_ADMIN?[{k:'operatorId',l:'Operator',opts:DB.operators.map(o=>[o.id,o.name])}]:[])],row:'dc_open',sort:'at',dir:-1,nocrud:1,exp:'trip_checklists'});
return`<div class="page">${ph('Driver reports','Reports and trip checklists your drivers send.','',[[IS_ADMIN?'Operators':'Fleet'],['Driver reports']])}
<div class="kg">${kc('file',M2.length,IS_ADMIN?'Reports due or late':'Reports due or late',od.length?od.length+' overdue':'',od.length?false:true)}${kc('clock',R.filter(x=>x.status==='SUBMITTED').length,'Waiting for review','')}${kc('refresh',R.filter(x=>x.status==='RETURNED').length,'Sent back to drivers','')}${kc('check',dChecks().filter(x=>x.result==='OVERRIDDEN').length,'Trips started past a failed check','',dChecks().filter(x=>x.result==='OVERRIDDEN').length?false:true)}</div>
${tabsH('dp',[['rep','Reports',R.filter(x=>x.status!=='DRAFT').length],['mis','Missing',M2.length],['chk','Trip checklists',dChecks().length]],t)}${b}</div>`},()=>dMissing().filter(x=>x.state==='OVERDUE').length);
A.dr_open=v=>{const r=byId(DB.driverReports,v);if(!r)return;const rt=(DX.rulesFor(DB,r.operatorId).reports.find(x=>x.id===r.typeId))||{name:r.typeName,fields:Object.keys(r.answers||{}).map(k=>({id:k,label:k,type:'text'}))};
const rows=rt.fields.map(f=>{let val=f.type==='auto'?DX.autoVal(f.auto,r.operatorId,r.driver,r.period,r.answers,rt,r.snapshot):(r.answers||{})[f.id];const fl=(r.files||{})[f.id];return`<tr><td class="m" style="width:42%">${esc(f.label)}</td><td>${f.type==='photo'||f.type==='file'?(fl&&fl.length?fchips(fl):'-'):esc(val==null||val===''?'-':val)}</td></tr>`}).join('');
openModal({t:r.typeName+' - '+r.driver,w:'wide',b:`${kvl({Driver:esc(r.driver),Operator:esc((DB.operators.find(o=>o.id===r.operatorId)||{}).name||''),Report:esc(perLabel(r)),Sent:fdt(r.submittedAt)+(r.late?' (late)':''),Status:sChip(r.status),...(r.reviewComment?{'Review note':esc(r.reviewComment)+(r.reviewedBy?' - '+esc(r.reviewedBy):'')}:{})})}${r.snapshot?`<h4 class="mt">${r.snapshot.kind==='WEEKLY'?'The week':'The trips'}, from the system</h4><div class="tw"><table class="dt" style="min-width:0"><thead><tr>${DX.tripHead(r.snapshot).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${DX.tripRows(r.snapshot).map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td>No trips</td></tr>'}</tbody></table></div><p class="sm m">Saved by the system when the report was sent. The driver cannot change these numbers.</p>`:''}<h4 class="mt">Totals and what the driver wrote</h4><div class="tw"><table class="dt" style="min-width:0"><tbody>${rows}</tbody></table></div>`,f:`<button class="cta gh" data-a="mdl_x">Close</button>${r.status==='SUBMITTED'&&!IS_ADMIN&&canEdit('dreports')?`<button class="cta dg" data-a="dr_ret" data-v="${v}">Send back</button><button class="cta ok" data-a="dr_appr" data-v="${v}">Approve</button>`:''}`})};
A.dr_appr=v=>{const r=byId(DB.driverReports,v);r.status='APPROVED';r.reviewedBy=(typeof ME==='function'&&ME()?ME().name:'Operator');r.reviewComment=r.reviewComment||'';audit('Approved driver report',r.id);closeModal();render();toast('Approved. The driver is told.')};
A.dr_ret=v=>openModal({t:'Send back to the driver',w:'sm2',b:fld('rc','What should the driver fix?','',{type:'textarea',req:1}),f:`<button class="cta gh" data-a="mdl_x">Cancel</button><button class="cta dg" data-a="dr_ret_ok" data-v="${v}">Send back</button>`});
A.dr_ret_ok=v=>{if(!chk([['rc','A note']]))return;const r=byId(DB.driverReports,v);r.status='RETURNED';r.reviewComment=gv('rc').trim();r.reviewedBy=(typeof ME==='function'&&ME()?ME().name:'Operator');audit('Returned driver report',r.id);closeModal();render();toast('Sent back. The driver is told.')};
A.dr_remind=v=>{const pp=v.split('||'),k=pp[0],name=pp[1],x=dMissing().find(m=>m.key===k&&m.driver===name);if(!x)return toast('Nothing to remind');
if(IS_ADMIN)AbraStore.notify('client:'+x.operatorId,'Driver report missing',x.driver+' has not sent the '+x.type.name.toLowerCase()+' for '+x.label,'dreports','file');else AbraStore.notify('driver:'+x.driver,'Please send your report','Your '+x.type.name.toLowerCase()+' for '+x.label+' is '+(x.state==='OVERDUE'?'overdue':'due')+'.','reports','file');toast(IS_ADMIN?'The operator is told':'Reminder sent to '+x.driver)};
A.dc_open=v=>{const c=byId(DB.tripChecks,v);if(!c)return;const ic2=s=>s==='PASS'?'OK':s==='FAIL'?'Problem':'-';
const rows=c.items.map(i=>`<tr><td>${esc(i.label)}</td><td>${esc(i.value==null||i.value===''?'-':i.value)}</td><td>${i.state==='PASS'?chip('OK','g'):i.state==='FAIL'?chip(i.level==='BLOCK'?'Problem':'Warning','r'):'-'}</td><td>${i.files&&i.files.length?fchips(i.files):''}</td></tr>`).join('');
openModal({t:(c.kind==='PRE'?'Before the trip: ':'After the trip: ')+c.tripId,w:'wide',b:`${kvl({Driver:esc(c.driver),Trip:esc(c.tripId)+' '+esc(c.route),When:fdt(c.at),Odometer:c.odometer?num(c.odometer)+' km':'-',Result:c.result==='PASSED'?chip('Passed','g'):c.result==='WARNINGS'?chip('Warnings','a'):chip('Started anyway','r'),...(c.warnings&&c.warnings.length?{Warnings:esc(c.warnings.join('; '))}:{})})}${c.override?hb('<b>Started past a failed check.</b> Reason: '+esc(c.override.reason),'r','alert')+proofRow(c.override.files,'Proof'):''}<h4 class="mt">Answers</h4><div class="tw"><table class="dt" style="min-width:0"><thead><tr><th>Item</th><th>Answer</th><th>Result</th><th>Photo</th></tr></thead><tbody>${rows}</tbody></table></div>`,f:`<button class="cta" data-a="mdl_x">Close</button>`})};

/* ===================== 5. BOOT ===================== */
setInterval(()=>{if(S.route==='tracking'&&!S.modal&&!document.activeElement.matches('input,select,textarea')){DB.live.forEach(l=>{if(l.state==='LIVE'&&l.src!=='driver'){l.x=Math.min(92,Math.max(6,l.x+(rnd()-.4)*1.6));l.y=Math.min(88,Math.max(10,l.y+(rnd()-.5)*1.4));l.ping=new Date().toISOString();l.progress=Math.min(99,l.progress+(rnd()<.3?1:0))}});render()}},4000);
document.title='Abra Partner Demo';
if(!location.hash)location.hash='#/dashboard';
document.documentElement.setAttribute('data-theme',S.theme);
loadFlash();

</script>
